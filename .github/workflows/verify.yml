name: Verify

# Every push and pull request is linted, type-checked, tested and built, and
# its Docker image is built and served.
#
# fuzzley.games is served by Cloud Run, which builds the Dockerfile from main
# on its own (a Cloud Build trigger) and doesn't depend on this workflow.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # .node-version is the one the workflows run; the Dockerfile has to
      # name its own image, so this keeps the two on the same major version.
      - name: Check the Dockerfile builds on the same Node
        run: |
          want=$(cut -d. -f1 .node-version)
          have=$(sed -n 's/^FROM node:\([0-9]*\)[.-].*/\1/p' Dockerfile)
          echo "Node $want in .node-version, Node $have in the Dockerfile"
          [ "$want" = "$have" ] ||
            { echo "::error::.node-version says Node $want, but the Dockerfile builds on Node $have."; exit 1; }

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Lint, type-check, test and build
        working-directory: frontend
        run: yarn verify

  # Cloud Run builds the same Dockerfile from main without waiting for these
  # checks, so build the image here too, serve it, and request its pages and
  # games.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg COMMIT_SHA=${{ github.sha }} -t fuzzley-games .

      - name: Serve the image and check its pages
        run: .github/scripts/check-image.sh fuzzley-games "$GITHUB_SHA"
