name: Verify

# Every push and pull request is linted, type-checked, tested and built, and
# its Docker image is built and served, each check on a runner of its own so
# they run side by side.
#
# fuzzley.games is served by Cloud Run, which builds and deploys the
# Dockerfile from the live branch (a Cloud Build trigger). When every check
# passes on a commit of main, the promote job moves live to it, so a commit
# goes live only once it has passed them.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 26 no longer bundles Corepack, so each job installs the one the
  # Dockerfile does, rather than whichever the runner image carries.
  COREPACK_VERSION: 0.36.0

jobs:
  # Whether anything but Markdown and docs/ changed since live, the last
  # commit of main that passed, or a pull request's base: where nothing
  # else did, only lint runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}

    steps:
      # Every commit, to compare with live, but only the files this commit has.
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Decide what the run checks
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/changes-code.sh "$BASE"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      # .node-version is the one the workflows run; the Dockerfile has to
      # name its own image and install its own Corepack, so this keeps the two
      # on the same major version of Node and the same Corepack. Dependabot
      # moves neither pin.
      - name: Check the Dockerfile builds on the same Node and Corepack
        run: |
          want=$(cut -d. -f1 .node-version)
          have=$(sed -n 's/^FROM node:\([0-9]*\)[.-].*/\1/p' Dockerfile)
          echo "Node $want in .node-version, Node $have in the Dockerfile"
          [ "$want" = "$have" ] ||
            { echo "::error::.node-version says Node $want, but the Dockerfile builds on Node $have."; exit 1; }
          corepack=$(sed -n 's/.*corepack@\([0-9][0-9.]*\).*/\1/p' Dockerfile)
          echo "Corepack $COREPACK_VERSION here, Corepack $corepack in the Dockerfile"
          [ "$COREPACK_VERSION" = "$corepack" ] ||
            { echo "::error::This job installs Corepack $COREPACK_VERSION, but the Dockerfile installs $corepack."; exit 1; }

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend
        with:
          corepack-version: ${{ env.COREPACK_VERSION }}

      # Prettier's cache keys each file on its contents and Prettier's
      # options, so the last run's serves any commit.
      - name: Restore Prettier's cache
        uses: actions/cache@v6
        with:
          path: frontend/node_modules/.cache/prettier
          key: prettier-${{ hashFiles('frontend/yarn.lock') }}-${{ github.sha }}
          restore-keys: prettier-${{ hashFiles('frontend/yarn.lock') }}-

      - name: Lint
        working-directory: frontend
        run: yarn lint

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend
        with:
          corepack-version: ${{ env.COREPACK_VERSION }}

      # tsc's build info, which lets each `tsc` pass check again only what
      # changed; it keys each file on its contents, so the last run's serves
      # any commit.
      - name: Restore tsc's build info
        uses: actions/cache@v6
        with:
          path: |
            frontend/tsconfig.*.tsbuildinfo
            frontend/lib/*/tsconfig.*.tsbuildinfo
            frontend/games/*/tsconfig.*.tsbuildinfo
            frontend/site/tsconfig.*.tsbuildinfo
          key: tsc-${{ hashFiles('frontend/yarn.lock') }}-${{ github.sha }}
          restore-keys: tsc-${{ hashFiles('frontend/yarn.lock') }}-

      - name: Type-check
        working-directory: frontend
        run: yarn typecheck

  # The tests with coverage, failing below each workspace's floors, in three
  # parts of about the same length: the four longest suites, two to a
  # runner, each with all its cores, one after the other, and every other
  # workspace, four at a time, so a workspace added later lands there. The
  # last part leaves out exactly the four the pairs name, or a suite would
  # run twice or nowhere.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: asteroid-breaker, brick-breaker
            args: --only asteroid-breaker,brick-breaker --jobs 1
          - part: brick-fuzz-pop, solitaire
            args: --only brick-fuzz-pop,solitaire --jobs 1
          - part: the rest
            args: --except solitaire,brick-breaker,asteroid-breaker,brick-fuzz-pop

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend
        with:
          corepack-version: ${{ env.COREPACK_VERSION }}

      - name: Test with coverage
        working-directory: frontend
        run: node tools/run-tests.mjs test:coverage ${{ matrix.args }}

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      - name: Set up the frontend
        uses: ./.github/actions/setup-frontend
        with:
          corepack-version: ${{ env.COREPACK_VERSION }}

      - name: Build
        working-directory: frontend
        run: yarn build

      # jsdom has no layout, so each game with a layout check opens its build
      # in the runner's Chrome at the shapes a game takes.
      - name: Check the games' layout in Chrome
        working-directory: frontend
        run: yarn check:layout

  # Build the image Cloud Run will build, serve it, and request its pages and
  # games.
  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg COMMIT_SHA=${{ github.sha }} -t fuzzley-games .

      - name: Serve the image and check its pages
        run: .github/scripts/check-image.sh fuzzley-games "$GITHUB_SHA"

  # Moves live, the branch Cloud Run deploys, to a commit of main that passed
  # every check, or only lint where nothing else changed. Pushes made with
  # GITHUB_TOKEN start Cloud Build's trigger, though not other workflows.
  promote:
    needs: [changes, lint, typecheck, test, build, docker]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.changes.result == 'success'
      && needs.lint.result == 'success'
      && (needs.changes.outputs.code == 'false'
      || (needs.typecheck.result == 'success'
      && needs.test.result == 'success'
      && needs.build.result == 'success'
      && needs.docker.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # One move at a time, so an older commit can't overtake a newer one.
    concurrency:
      group: promote
      cancel-in-progress: false

    steps:
      # Every commit, to compare live with this one, but only the files this
      # commit has: the history holds the Solitaire Collection's old card
      # atlases and screenshots, which comparing doesn't need.
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Only ever forward: a run that finishes after a newer one leaves live
      # where it is. If live has commits main doesn't, it was moved by hand,
      # and moves on only once main contains them.
      - name: Move live to this commit
        run: |
          if ! git rev-parse -q --verify origin/live > /dev/null; then
            echo "Creating live at ${GITHUB_SHA::7}."
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/live; then
            echo "live is already at ${GITHUB_SHA::7} or past it."
            exit 0
          elif ! git merge-base --is-ancestor origin/live "$GITHUB_SHA"; then
            echo "::error::live has commits that main doesn't, so it wasn't moved. Bring them into main, or reset live to a commit of main."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/live"
