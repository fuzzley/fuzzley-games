name: Verify

# Every push and pull request is linted, type-checked, tested and built, and
# its Docker image is built and served.
#
# fuzzley.games is served by Cloud Run, which builds and deploys the
# Dockerfile from the live branch (a Cloud Build trigger). When both checks
# pass on a commit of main, the promote job moves live to it, so a commit goes
# live only once it has passed them.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Node 26 no longer bundles Corepack, so this job installs the one the
      # Dockerfile does, rather than whichever the runner image carries.
      COREPACK_VERSION: 0.36.0

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # .node-version is the one the workflows run; the Dockerfile has to
      # name its own image and install its own Corepack, so this keeps the two
      # on the same major version of Node and the same Corepack. Dependabot
      # moves neither pin.
      - name: Check the Dockerfile builds on the same Node and Corepack
        run: |
          want=$(cut -d. -f1 .node-version)
          have=$(sed -n 's/^FROM node:\([0-9]*\)[.-].*/\1/p' Dockerfile)
          echo "Node $want in .node-version, Node $have in the Dockerfile"
          [ "$want" = "$have" ] ||
            { echo "::error::.node-version says Node $want, but the Dockerfile builds on Node $have."; exit 1; }
          corepack=$(sed -n 's/.*corepack@\([0-9][0-9.]*\).*/\1/p' Dockerfile)
          echo "Corepack $COREPACK_VERSION here, Corepack $corepack in the Dockerfile"
          [ "$COREPACK_VERSION" = "$corepack" ] ||
            { echo "::error::This job installs Corepack $COREPACK_VERSION, but the Dockerfile installs $corepack."; exit 1; }

      - name: Install Corepack
        run: npm install -g "corepack@$COREPACK_VERSION" && corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Lint, type-check, test and build
        working-directory: frontend
        run: yarn verify

  # Build the image Cloud Run will build, serve it, and request its pages and
  # games.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg COMMIT_SHA=${{ github.sha }} -t fuzzley-games .

      - name: Serve the image and check its pages
        run: .github/scripts/check-image.sh fuzzley-games "$GITHUB_SHA"

  # Moves live, the branch Cloud Run deploys, to a commit of main that passed
  # both jobs. Pushes made with GITHUB_TOKEN start Cloud Build's trigger,
  # though not other workflows. Update games runs this workflow on main after
  # it pushes, since its push can't start it.
  promote:
    needs: [verify, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One move at a time, so an older commit can't overtake a newer one.
    concurrency:
      group: promote
      cancel-in-progress: false

    steps:
      # Every commit, to compare live with this one, but only the files this
      # commit has: the history holds the Solitaire Collection's old card
      # atlases and screenshots, which comparing doesn't need.
      - name: Checkout fuzzley-games
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # Only ever forward: a run that finishes after a newer one leaves live
      # where it is. If live has commits main doesn't, it was moved by hand,
      # and moves on only once main contains them.
      - name: Move live to this commit
        run: |
          if ! git rev-parse -q --verify origin/live > /dev/null; then
            echo "Creating live at ${GITHUB_SHA::7}."
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/live; then
            echo "live is already at ${GITHUB_SHA::7} or past it."
            exit 0
          elif ! git merge-base --is-ancestor origin/live "$GITHUB_SHA"; then
            echo "::error::live has commits that main doesn't, so it wasn't moved. Bring them into main, or reset live to a commit of main."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/live"
