# Proposes dependency updates as pull requests, which verify.yml checks like
# any other. Nothing merges on its own: a merge to main deploys once it passes.
#
# The cooldown leaves a release a day before proposing it, as Yarn's
# npmMinimalAgeGate does for anything added by hand (frontend/.yarnrc.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      # Angular's packages release together and must move together.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@analogjs/*"
          - "angular-eslint"
          - "@angular-eslint/*"
      lint-and-test:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
          - "stylelint*"
          - "prettier"
          - "vitest"
          # The coverage provider has to stay on Vitest's own version.
          - "@vitest/*"
          - "jsdom"
          - "@testing-library/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
  # The Dockerfile's base images, pinned by version and digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
