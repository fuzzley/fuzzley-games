<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The fuzzball, which @fz/style's Vite plugin makes in the default
      palettes' accents and ThemeService recolors to the one in use. The ICO
      and the home screen icon are for what draws no SVG; the ICO's sizes
      keeps a browser that draws both from picking it.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" vite-ignore />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" vite-ignore />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" vite-ignore />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solitaire games, from Klondike and Spider to Pyramid and TriPeaks, and Minesweeper, free to play in your browser."
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Fuzzley Games</title>
    <!--
      Plain tags, so they run in order before anything paints: the palette
      (theme.js, which @fz/style's Vite plugin makes from its list of
      palettes; vite-ignore tells Vite it isn't for bundling), the runtime
      config, then Google Analytics (see public/analytics.js).
    -->
    <script src="/theme.js" vite-ignore></script>
    <script src="/env.js"></script>
    <script src="/analytics.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
