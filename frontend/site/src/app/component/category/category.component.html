@if (category(); as category) {
  <main class="page">
    <a class="back" routerLink="/">All games</a>
    <div class="head">
      <h1>{{ category.name }}</h1>
      <span class="count">{{ count() }}</span>
    </div>
    <p class="description">{{ category.description }}</p>
    <ul class="grid">
      @for (tile of tiles(); track tile.game.slug) {
        <li><app-game-tile [game]="tile.game" [eager]="tile.eager" /></li>
      }
    </ul>
  </main>
} @else {
  <app-not-found kind="category" />
}
