<header class="bar">
  <div class="inner">
    <a class="brand" routerLink="/">Fuzzley Games</a>

    <nav class="categories" aria-label="Categories">
      @for (category of categories; track category.id) {
        <a
          [routerLink]="['/category', category.id]"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          >{{ category.name }}</a
        >
      }
    </nav>

    <div class="tools">
      <!-- The role repeats the element's own, for tools that predate <search>. -->
      <search role="search">
        <label class="search">
          <app-icon name="search" />
          <span class="fz-visually-hidden">Search games</span>
          <input
            #box
            type="search"
            placeholder="Search games"
            autocomplete="off"
            [value]="query()"
            (input)="search(box.value)"
            (keydown.escape)="search('')"
          />
        </label>
      </search>
      <app-theme-menu />
    </div>
  </div>
</header>
