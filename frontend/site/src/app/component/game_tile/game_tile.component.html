@if (view().play; as play) {
  <div class="tile">
    <a class="tile-link" [routerLink]="['/games', game().slug]">
      <ng-container *ngTemplateOutlet="content" />
    </a>
    <a class="play" [href]="play.href" [attr.aria-label]="play.label">
      <fz-icon name="play" />
      Play
    </a>
  </div>
} @else {
  <div class="tile soon">
    <ng-container *ngTemplateOutlet="content" />
  </div>
}

<ng-template #content>
  <app-game-thumb class="thumb" [game]="game()" [eager]="eager()" />
  <span class="name">
    {{ game().name }}
    @if (view().badge; as badge) {
      <span class="fz-badge" [class.fz-badge-accent]="badge.new">{{
        badge.text
      }}</span>
    }
  </span>
  <span class="meta">
    <span>
      <fz-icon name="players" />
      {{ view().players }}
    </span>
    <span>
      <fz-icon name="time" />
      {{ view().length }}
    </span>
  </span>
</ng-template>
