<footer class="foot">
  <div class="inner">
    <p class="credits">
      <span
        >© {{ year }}
        <a
          href="https://fuzzley.info"
          target="_blank"
          rel="noopener"
          aria-label="Andrey Gavel (opens in a new tab)"
          >Andrey Gavel</a
        ></span
      >
      <a
        [href]="repository"
        target="_blank"
        rel="noopener"
        aria-label="Source on GitHub (opens in a new tab)"
        >Source on GitHub</a
      >
    </p>
    @if (commit; as commit) {
      <p>
        Built from
        <a
          [href]="commit.href"
          target="_blank"
          rel="noopener"
          [attr.aria-label]="commit.label"
          >{{ commit.hash }}</a
        >
        on {{ builtOn }}
      </p>
    } @else {
      <p>Built on {{ builtOn }}</p>
    }
  </div>
</footer>
