<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solitaire, card games and classics like Minesweeper, free to play in your browser." />
    <meta name="theme-color" content="#ffffff" />
    <title>Fuzzley Games</title>
    <script>
      // Pick the palette before anything paints. Keep in step with ThemeService.
      (function () {
        var themes = ['classic', 'pastel', 'casino', 'midnight'];
        var saved;
        try {
          saved = localStorage.getItem('fuzzley-theme');
        } catch (e) {}
        var dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = themes.indexOf(saved) >= 0 ? saved : dark ? 'casino' : 'classic';
      })();
    </script>
    <!-- Runtime config, then Google Analytics; see public/analytics.js. Plain tags so they run in order. -->
    <script src="/env.js"></script>
    <script src="/analytics.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
