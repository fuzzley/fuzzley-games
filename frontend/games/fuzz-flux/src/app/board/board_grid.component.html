<!--
  The board's squares, a row at a time, each cell over the square the scene
  draws. A gap is no cell, and a row of gaps no row, so the grid says how
  big the board is, and each row and each cell where it lies.
-->
<div
  class="grid"
  role="grid"
  aria-describedby="board-keys"
  [attr.aria-label]="label()"
  [attr.aria-rowcount]="grid().height"
  [attr.aria-colcount]="grid().width"
>
  @for (row of rows(); track row.line) {
    <div
      class="row"
      role="row"
      [attr.aria-rowindex]="row.line"
      [style.--line]="row.line"
    >
      @for (cell of row.cells; track cell.index) {
        <!--
          The click is the one assistive technology makes on a cell, as
          every press goes through to the canvas. The lint rule asking for
          a key does not know that the scene hears the board's keys, Space
          and Enter playing the square in focus.
        -->
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -->
        <div
          #gridCell
          class="cell"
          role="gridcell"
          [tabindex]="cell.tabIndex"
          [attr.aria-colindex]="cell.column"
          [attr.aria-label]="cell.name"
          [attr.aria-selected]="cell.selected"
          [attr.data-index]="cell.index"
          [style.--column]="cell.column"
          (focus)="followFocus(cell.index)"
          (click)="tap(cell.index)"
        ></div>
      }
    </div>
  }
</div>

<!--
  The keys needed to play, one at a time, which describe the board.
  `role="list"`, as Safari's VoiceOver stops calling a list with no markers
  one.
-->
<ul id="board-keys" class="fz-visually-hidden" role="list" aria-label="Keys">
  @for (key of keys; track $index) {
    <li>{{ key }}</li>
  }
</ul>
