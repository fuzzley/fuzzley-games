<!--
  The canvas and the grid over it, which a press anywhere on them focuses.
  The grid takes no press, so each reaches the canvas. This can take the
  focus, though it is no tab stop, so the room around the board cancels no
  press on it, which would keep the press from Phaser's mouse; it keeps the
  focus a press gives the grid from the mouse, which would move it here, and
  hands the grid the focus that does land here.
-->
<div
  class="play"
  tabindex="-1"
  (pointerdown)="takeFocusForPress()"
  (mousedown)="$event.preventDefault()"
  (focus)="passFocusToGrid()"
>
  <fz-phaser-canvas [scene]="scene" [options]="hostOptions">
    <!-- The level's squares, where the scene will draw them, until it does. -->
    <div fzCanvasPlaceholder class="placeholder" aria-hidden="true">
      <div class="squares" [style]="boardStyle()">
        @for (well of wells(); track $index) {
          <div class="square" [class.well]="well"></div>
        }
      </div>
    </div>
  </fz-phaser-canvas>
  <app-board-grid [style]="boardStyle()" />
</div>

<!--
  The game's panels, laid where the board says, outside the grid, read as a
  page is.
-->
<ng-content />

<div class="cards">
  <!-- Still loading, and couldn't be drawn: the canvas's own cards. -->
  <fz-canvas-cards [canvas]="canvas()" />
</div>
