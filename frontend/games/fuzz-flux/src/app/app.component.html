<!--
  The board first and the bar after it, as in the other games: a <main>
  landmark a screen reader can jump to, under the bar.
-->
<main class="stage">
  <!-- Read before the board, and shown on the bar's side of it. -->
  @if (lineBesideBar(); as line) {
    <p class="new-thing">{{ line }}</p>
  }
  <div class="room" fzPlayRoom (away)="game.pause()">
    <app-board #board [goalPictures]="goalPictures()" [sound]="soundOn()">
      @if (board.panels(); as panels) {
        <section class="panel level-panel" [style]="panels.left">
          <h2 class="level">
            <app-level-title [level]="game.state().level" />
          </h2>
          <app-level-figures [state]="game.state()" [pictures]="pictures()" />
          @if (lineInPanel(); as line) {
            <p class="new-thing">{{ line }}</p>
          }
        </section>
        <div class="panel buttons" [style]="panels.right">
          <!-- Hint keeps the focus on the board, as the bar's does. -->
          <button
            type="button"
            class="fz-button fz-button-secondary"
            fzKeepKeys
            (pointerdown)="$event.preventDefault()"
            (click)="game.hint()"
          >
            <fz-icon name="bulb" />
            Hint
          </button>
          <button
            type="button"
            class="fz-button fz-button-secondary"
            fzKeepKeys
            (click)="restart()"
          >
            <fz-icon name="restart" />
            Restart
          </button>
        </div>
      } @else if (lineBesideBoard(); as beside) {
        <p class="new-thing beside-board" [style]="beside.room">
          {{ beside.line }}
        </p>
      }
      <app-level-card
        [state]="game.state()"
        [pictures]="pictures()"
        [nextLevel]="game.hasNextLevel()"
        (choose)="chooseFromCard($event)"
      />
    </app-board>
  </div>
</main>

<app-bar
  [state]="game.state()"
  [pictures]="pictures()"
  [panelled]="panelled()"
  [soundOn]="soundOn()"
  (hint)="game.hint()"
  (restart)="restart()"
  (toggleSound)="toggleSound()"
  (chooseLevel)="levelsOpen.set(true)"
  (openSettings)="settingsOpen.set(true)"
/>

<!-- In the page from the start, so a screen reader is listening to it. -->
<fz-announcer />

<app-choose-level [open]="levelsOpen()" (closed)="levelsOpen.set(false)" />
<app-settings [open]="settingsOpen()" (closed)="settingsOpen.set(false)" />
<fz-confirm-dialog />
<fz-bug-report-dialog [touch]="viewport.isTouchScreen()" />
