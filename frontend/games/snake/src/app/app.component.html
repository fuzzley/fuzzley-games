<!--
  The board first and the bar after it, as in the other games: a <main>
  landmark a screen reader can jump to, under the bar, whose menu opens over
  it.
-->
<main class="stage">
  <div
    class="room"
    fzPlayRoom
    [class.with-arrows]="showArrows()"
    (away)="pauseRun()"
  >
    <app-board #board [arrows]="showArrows()" />
    @if (showArrows()) {
      <app-arrows
        (handBack)="board.focus({ preventScroll: true, focusVisible: false })"
      />
    }
  </div>
</main>

<app-bar
  (openHelp)="helpOpen.set(true)"
  (openSettings)="settingsOpen.set(true)"
  (handBack)="board.focus()"
/>

<!-- In the page from the start, so a screen reader is listening to it. -->
<fz-announcer />

<app-settings [open]="settingsOpen()" (closed)="settingsOpen.set(false)" />
<app-help [open]="helpOpen()" (closed)="helpOpen.set(false)" />
<app-result />
<fz-confirm-dialog />
