<div class="pad" role="group" aria-label="Arrows">
  @for (arrow of arrows; track arrow.direction) {
    <button
      type="button"
      class="arrow"
      [attr.data-direction]="arrow.direction"
      [attr.aria-label]="arrow.label"
      (pointerdown)="onPointerDown($event, arrow.direction)"
      (click)="onClick($event, arrow.direction)"
    >
      <fz-icon name="chevron" />
    </button>
  }
</div>
