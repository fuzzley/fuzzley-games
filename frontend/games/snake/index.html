<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snake</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tints the mobile browser's chrome to match the page, Classic felt's
      until ThemeService sets the palette's own.
    -->
    <meta name="theme-color" content="#ffffff" />

    <!-- For search engines and link previews. -->
    <meta
      name="description"
      content="Snake, free in your browser. Eat the apples, and don’t hit the walls or your own tail. The snake speeds up as it grows. Fill the board to win."
    />
    <link rel="canonical" href="https://fuzzley.games/play/snake/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Snake" />
    <meta
      property="og:description"
      content="Snake, free in your browser. Eat the apples, and don’t hit the walls or your own tail. The snake speeds up as it grows. Fill the board to win."
    />
    <meta property="og:url" content="https://fuzzley.games/play/snake/" />
    <meta
      property="og:image"
      content="https://fuzzley.games/play/snake/docs/screenshots/snake/preview.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1440" />
    <meta
      property="og:image:alt"
      content="A paused game of Snake, with a gold snake heading for a red apple."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Snake",
        "url": "https://fuzzley.games/play/snake/",
        "description": "Snake, free in your browser. Eat the apples, and don’t hit the walls or your own tail. The snake speeds up as it grows. Fill the board to win.",
        "applicationCategory": "GameApplication",
        "genre": ["Arcade", "Action game"],
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

  <body>
    <app-root></app-root>
    <noscript>
      <h1>Snake</h1>
      <p>
        Eat the apples. Don’t hit the walls or your own tail. Turn on JavaScript
        to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
