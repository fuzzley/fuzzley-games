<!doctype html>
<html lang="en">
  <head>
    <title>fSolitaire</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="user-scalable=no, width=device-width, initial-scale=1.0"
    />
    <meta http-equiv="cleartype" content="on" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      /*
       * The app fills the viewport: the game canvas host inside it sizes itself
       * to 100% height, which only resolves if its ancestors do too.
       */
      app-root {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/ui/app/main.ts"></script>
  </body>
</html>
