<!doctype html>
<html lang="en">
  <head>
    <title>fSolitaire</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="user-scalable=no, width=device-width, initial-scale=1.0"
    />
    <meta http-equiv="cleartype" content="on" />
    <style>
      /*
       * Phaser only expands the canvas parent for its own scale modes, and the
       * game runs in NONE mode so ViewportScaler can control the backing store
       * resolution. These rules stand in for that, sizing #game to the viewport
       * without making it a positioned box, which would paint it over the UI
       * overlay that precedes it in the document.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      #game {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <div id="game"></div>
    <script type="module" src="/src/ui/app/main.ts"></script>
  </body>
</html>
