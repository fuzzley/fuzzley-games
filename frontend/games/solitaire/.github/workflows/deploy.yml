name: Build and Sync to Main Website

on:
  push:
    branches:
      - main
  # Verified only: the deploy job below never runs for a pull request.
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: "Force deployment even if there are no changes"
        required: false
        type: boolean
        default: false

jobs:
  # Gates the deploy, and checks every pull request: nothing reaches the live
  # site without passing lint, both typecheck passes (src and test), and the
  # full test suite.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fSolitaire
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      # Yarn 4 keeps its packages in a global cache folder of its own, so the
      # folder is asked of Yarn rather than left to setup-node to guess.
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc

      - name: Test
        run: yarn test

  build-and-sync:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    # One deploy at a time: a later push waits for the one under way rather
    # than racing it to push to fuzzley/fuzzley, and a deploy is never cut off
    # halfway.
    concurrency:
      group: deploy-main-website
      cancel-in-progress: false

    steps:
      - name: Checkout fSolitaire
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      # The commit goes into the build so a bug report can name it.
      - name: Build production assets
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: yarn build

      - name: Configure git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync built assets to fuzzley/fuzzley
        env:
          PAT_TOKEN: ${{ secrets.MAIN_REPO_DEPLOY_PAT }}
          FORCE_DEPLOY: ${{ github.event.inputs.force }}
        run: |
          git clone --depth 1 https://x-access-token:${{ env.PAT_TOKEN }}@github.com/fuzzley/fuzzley.git main-website

          DEST_DIR="main-website/frontend/public/project/solitaire"

          rm -rf "$DEST_DIR"
          mkdir -p "$DEST_DIR"

          cp -r dist/* "$DEST_DIR"/

          cd main-website
          git add .

          if git diff-index --quiet HEAD && [ "$FORCE_DEPLOY" != "true" ]; then
            echo "No changes in fSolitaire production build. Skipping commit."
          else
            git commit --allow-empty -m "chore(deploy): sync fSolitaire production build from fuzzley/fSolitaire@${{ github.sha }}"
            git push origin HEAD
          fi
