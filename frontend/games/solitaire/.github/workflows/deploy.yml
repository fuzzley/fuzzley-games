name: Build and publish to fuzzley.info

# Every push to main is verified, then built and published to this
# repository's site-build release. fuzzley/fuzzley fetches it from there: a
# scheduled workflow in that repository moves its pin to the newest build
# within about 15 minutes, and fuzzley.info redeploys.

on:
  push:
    branches:
      - main
  # Verified only: the deploy job below never runs for a pull request.
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Gates the deploy, and checks every pull request: nothing reaches the live
  # site without passing lint, both typecheck passes (src and test), and the
  # full test suite.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fSolitaire
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      # Yarn 4 keeps its packages in a global cache folder of its own, so the
      # folder is asked of Yarn rather than left to setup-node to guess.
      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc

      - name: Test
        run: yarn test

  build-and-publish:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    # Moves the site-build tag and uploads to its release.
    permissions:
      contents: write
    # One deploy at a time: a later push waits for the one under way rather
    # than racing it to the release, and a deploy is never cut off halfway.
    concurrency:
      group: publish-site-build
      cancel-in-progress: false

    steps:
      - name: Checkout fSolitaire
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Locate the Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      # The commit goes into the build so a bug report can name it.
      - name: Build production assets
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
        run: yarn build

      # fuzzley.info fetches the game from here. The site-build release keeps
      # recent builds, each named after its commit; latest.json names the
      # newest, and fuzzley/fuzzley pins one in frontend/games.json, which a
      # scheduled workflow there moves to the newest every 15 minutes.
      - name: Publish the build to the site-build release
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: solitaire
          TAG: site-build
          KEEP: 10
        run: |
          set -euo pipefail
          asset="$SLUG-${GITHUB_SHA::7}.tar.gz"
          tar -czf "$asset" -C dist .
          jq -n \
            --arg asset "$asset" \
            --arg sha256 "$(sha256sum "$asset" | cut -d' ' -f1)" \
            --arg commit "$GITHUB_SHA" \
            --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{asset: $asset, sha256: $sha256, commit: $commit, built: $built}' \
            > latest.json

          # The tag, and so the release, follows the newest build.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --latest=false --title "Site build" \
              --notes "Production builds of the game for fuzzley.info, uploaded by the deploy workflow. Each archive is named after the commit it was built from, and latest.json names the newest. fuzzley/fuzzley pins one in frontend/games.json. The ten newest archives and the pinned one are kept."
          fi

          # The archive goes up first, so latest.json never names a missing file.
          gh release upload "$TAG" "$asset" --clobber
          gh release upload "$TAG" latest.json --clobber

          # Keep the newest archives and the one fuzzley.info pins. If the pin
          # can't be read, keep everything rather than risk deleting it.
          status=$(curl -sS -o pinned.json -w '%{http_code}' \
            https://raw.githubusercontent.com/fuzzley/fuzzley/main/frontend/games.json || echo 000)
          case "$status" in
            200) pinned=$(jq -r --arg slug "$SLUG" '.[$slug].asset // empty' pinned.json) ;;
            404) pinned="" ;;
            *)
              echo "::warning::Couldn't read fuzzley's games.json (HTTP $status), so no archives were deleted."
              exit 0
              ;;
          esac
          gh release view "$TAG" --json assets --jq \
            ".assets | map(select(.name | endswith(\".tar.gz\"))) | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].name" \
            | while read -r old; do
                if [ "$old" != "$pinned" ]; then
                  gh release delete-asset "$TAG" "$old" --yes
                fi
              done
