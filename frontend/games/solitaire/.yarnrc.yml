nodeLinker: node-modules

packageExtensions:
  # Only Analog's `ng test` builder and `ng add` schematic use these; the
  # Vitest setup this project imports does not.
  "@analogjs/vitest-angular@*":
    peerDependenciesMeta:
      "@angular-devkit/architect":
        optional: true
      "@angular-devkit/schematics":
        optional: true
