<div class="debug-panel" role="group" aria-labelledby="debug-panel-label">
  <p class="debug-label" id="debug-panel-label">Debug Options</p>
  @for (option of catalog.debugOptions(); track option.id) {
    <app-option-group
      [option]="option"
      [value]="catalog.optionValues()[option.id]"
      [compactLabel]="true"
      (choose)="chooseRule(option.id, $event)"
    />
  }

  <div class="load-position">
    <label class="load-label" for="load-position-text">Load Game State</label>
    <textarea
      #positionText
      id="load-position-text"
      class="load-text"
      rows="3"
      placeholder="Paste a bug report's game state"
    ></textarea>
    <button
      type="button"
      class="btn btn-secondary btn-block btn-load"
      (click)="loadPosition(positionText.value)"
    >
      Load
    </button>
    <!-- Always present, so a problem is announced when it arrives. -->
    <p class="load-problem" role="status">{{ loadProblem() }}</p>
  </div>
</div>
