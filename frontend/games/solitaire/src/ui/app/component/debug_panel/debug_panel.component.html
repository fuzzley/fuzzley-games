<div class="debug-panel">
  <label class="setting-label debug-label">Debug Options</label>
  @for (option of session.debugOptions(); track option.id) {
    <div class="setting-group">
      <label class="setting-sublabel">{{ option.label }}</label>
      <div class="segmented-control">
        @for (choice of option.choices; track choice.value) {
          <button
            class="segment-btn"
            [class.active]="session.optionValues()[option.id] === choice.value"
            (click)="session.setRuleOption(option.id, choice.value)"
          >
            {{ choice.label }}
          </button>
        }
      </div>
      @if (option.description) {
        <p class="setting-desc">{{ option.description }}</p>
      }
    </div>
  }
</div>
