<article class="preview" [attr.aria-labelledby]="titleId">
  @if (showBack()) {
    <button type="button" class="btn-back" (click)="back.emit()">
      <fz-icon class="back-icon" name="back" />
      All games
    </button>
  }

  <div class="shot" [attr.aria-busy]="imageStatus() === 'loading'">
    <img
      class="shot-image"
      [class.loaded]="imageStatus() === 'loaded'"
      [src]="imageUrl()"
      [alt]="imageAlt()"
      width="1280"
      height="720"
      decoding="async"
      (load)="onImageLoad()"
      (error)="onImageError()"
    />
    @if (imageStatus() === "loading") {
      <div class="skeleton-shimmer" aria-hidden="true"></div>
    }
  </div>

  <!-- Focusable from script only, so a narrow screen can land here. -->
  <h3 #title class="title" [id]="titleId" tabindex="-1">{{ item().name }}</h3>

  <ul class="facts" aria-label="At a glance">
    @for (fact of facts(); track $index) {
      <li class="fact">{{ fact }}</li>
    }
  </ul>

  @if (overview()) {
    <p class="overview">{{ overview() }}</p>
  }

  @for (option of options(); track option.id) {
    <app-option-group
      [option]="option"
      [value]="chosen()[option.id]"
      (choose)="choose(option.id, $event)"
    />
  }

  <div class="actions">
    <button
      type="button"
      class="btn btn-primary btn-play"
      (click)="deal.emit(chosen())"
    >
      {{ playLabel() }}
    </button>
    <button type="button" class="btn btn-secondary" (click)="help.emit()">
      How to play
    </button>
  </div>
</article>
