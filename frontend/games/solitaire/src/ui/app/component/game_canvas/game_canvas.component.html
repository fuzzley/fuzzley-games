<!--
  `aria-busy` belongs on the region that is loading — the board itself — rather
  than on the spinner announcing it.

  `role="img"`, not `role="application"`. Application tells a screen reader to
  stop interpreting keys and hand them all to us, which is only honest once
  there is a keyboard interface to hand them to. There is not: the board is
  played with a pointer. Claiming the role suppressed browse mode and offered
  nothing back, leaving the canvas less reachable than it is as a labelled
  image. Should the board ever be playable from the keyboard, this is the
  attribute to revisit first.
-->
<div
  #canvasHost
  class="canvas-container"
  role="img"
  [attr.aria-label]="gameName() + ' board'"
  [attr.aria-busy]="isInitializing()"
></div>

<div class="loading-overlay" [class.hidden]="!isInitializing()">
  <div
    class="skeleton-grid"
    aria-hidden="true"
    [style.grid-template-columns]="'repeat(' + layoutSpec().columns + ', 1fr)'"
    [style.grid-template-rows]="'repeat(' + layoutSpec().rows + ', 1fr)'"
  >
    @for (slot of layoutSpec().slots; track slot.pileId) {
      <div
        class="skeleton-slot"
        [style.grid-column]="slot.column + 1"
        [style.grid-row]="slot.row + 1"
      >
        <div class="skeleton-shimmer"></div>
      </div>
    }
  </div>

  <div class="loading-badge">
    <div class="spinner-ring" aria-hidden="true">
      <div class="mini-card-icon">♠</div>
    </div>
    <!--
      The live region is always present and only its text changes, so the
      status is announced when it arrives rather than the whole region
      appearing and disappearing around it.
    -->
    <p class="loading-text" role="status">
      @if (hasInitializationFailed()) {
        Board initialization timed out
      } @else if (isInitializing()) {
        Loading {{ gameName() }}...
      }
    </p>
  </div>
</div>

<!--
  A deck swap fetches a couple of megabytes while the board stays playable, so
  it gets a badge in the corner rather than the overlay above: nothing is
  blocked, and a player who has already closed the settings drawer still knows
  why the cards have not changed yet.

  Present whether or not a deck is loading, and hidden when none is, for the
  same reason as the loading text above: a live region that arrives with its
  message is a region that has nothing to announce.
-->
<div class="deck-badge" [class.hidden]="!pendingDeckName()">
  <span class="deck-badge-spinner" aria-hidden="true"></span>
  <span role="status">
    @if (pendingDeckName(); as deckName) {
      Loading {{ deckName }} cards...
    }
  </span>
</div>
