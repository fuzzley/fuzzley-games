<!--
  The board is the routed view: which game is on the table is the whole of
  this application's navigable state.
-->
<div class="board-area" [class.rail-expanded]="menu.isExpanded()">
  <router-outlet />
</div>
<div class="ui-overlay">
  <app-header-bar (openSettings)="openSettings()" />
  <app-game-menu />
  <app-settings-drawer [open]="showSettings()" (closed)="closeSettings()" />
  <app-game-help-modal />
  <app-victory-overlay />
  <app-confirmation-dialog />
</div>
