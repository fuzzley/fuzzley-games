@if (confirmation.isOpen()) {
  <div class="confirmation-overlay" (click)="confirmation.cancel()">
    <div class="confirmation-card" (click)="$event.stopPropagation()">
      <div class="warning-icon-container">
        <img src="icons/warning.svg" class="warning-icon" alt="Warning" />
      </div>
      <h3>Confirm Action</h3>
      <p class="confirmation-message">{{ confirmation.message() }}</p>
      <div class="confirmation-actions">
        <button class="btn btn-secondary" (click)="confirmation.cancel()">
          Cancel
        </button>
        <button class="btn btn-danger" (click)="confirmation.accept()">
          Confirm
        </button>
      </div>
    </div>
  </div>
}
