<fz-game-bar
  [placement]="placement()"
  [reversed]="reversed()"
  [compact]="viewport.isCompact()"
  [home]="home()"
  [homeHref]="homeHref"
>
  <!--
    The application's one <h1>, the game on the table, heard rather than seen:
    the switcher beside it shows the name.
  -->
  <h1 fzBarTitle class="fz-visually-hidden">{{ gameName() }}</h1>

  <button
    fzBarTitle
    type="button"
    class="game-switcher"
    aria-haspopup="dialog"
    [attr.aria-label]="switcherLabel()"
    [attr.aria-keyshortcuts]="browser.shortcutKeys"
    [title]="switcherTitle"
    (click)="browser.open()"
  >
    <fz-icon class="switcher-icon" name="grid" />
    <span class="switcher-name">{{ gameName() }}</span>
    <fz-icon class="switcher-chevron" name="chevron" />
  </button>

  <!--
    Score and moves announce themselves when they change. Each whole card is an
    atomic live region, so it reads "Score 350" rather than "350". The timer is
    not live: announcing it every second would drown out everything else.
  -->
  <div fzBarStatus class="metrics">
    <div class="metric-card score-card" role="status" aria-atomic="true">
      <span class="label">SCORE</span>
      <span class="value">{{ metrics.score() }}</span>
    </div>
    <div class="metric-card timer-card">
      <span class="label">TIME</span>
      <span class="value">{{ metrics.timerText() }}</span>
    </div>
    <div class="metric-card moves-card" role="status" aria-atomic="true">
      <span class="label">MOVES</span>
      <span class="value">{{ metrics.moves() }}</span>
    </div>
  </div>

  <button
    fzBarActions
    type="button"
    class="fz-button fz-button-secondary action"
    (click)="lifecycle.undo()"
    [disabled]="!metrics.canUndo()"
    title="Undo last move"
    aria-label="Undo last move"
  >
    <fz-icon name="undo" />
    <span class="btn-text">Undo</span>
  </button>

  <!--
    On a compact screen, restart, the rules, bug reports and settings move into
    the overflow menu. Each block holds one element, so it is projected into the
    actions as that element would be.
  -->
  @if (!viewport.isCompact()) {
    <button
      fzBarActions
      type="button"
      class="fz-button fz-button-secondary action"
      (click)="restart()"
      title="Restart current game"
      aria-label="Restart current game"
    >
      <fz-icon name="restart" />
      <span class="btn-text">Restart</span>
    </button>
  }

  <button
    fzBarActions
    type="button"
    class="fz-button action"
    (click)="newGame()"
    title="Start a brand new game"
    aria-label="Start a brand new game"
  >
    <fz-icon name="plus" />
    <span class="btn-text">New Game</span>
  </button>

  @if (!viewport.isCompact()) {
    <button
      fzBarActions
      type="button"
      class="fz-button fz-button-secondary fz-button-circle action btn-help"
      (click)="openHelp()"
      title="How to Play / Game Rules"
      aria-label="How to Play / Game Rules"
    >
      <fz-icon name="help" />
    </button>
  }

  @if (!viewport.isCompact()) {
    <button
      fzBarActions
      type="button"
      class="fz-button fz-button-secondary fz-button-circle action btn-bug-report"
      (click)="reportBug()"
      title="Report a Bug"
      aria-label="Report a Bug (opens GitHub in a new tab)"
    >
      <fz-icon name="bug" />
    </button>
  }

  @if (viewport.isCompact()) {
    <fz-bar-overflow
      fzBarActions
      [items]="overflowItems()"
      (choose)="chooseFromMenu($event)"
    />
  }

  @if (!viewport.isCompact()) {
    <button
      fzBarActions
      type="button"
      class="fz-button fz-button-secondary fz-button-circle action btn-settings"
      (click)="openSettings.emit()"
      title="Game Settings"
      aria-label="Game Settings"
    >
      <fz-icon name="settings" />
    </button>
  }
</fz-game-bar>
