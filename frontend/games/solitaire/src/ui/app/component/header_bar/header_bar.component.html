<header class="header-bar">
  <div class="brand">
    <span class="brand-text">fSolitaire</span>
  </div>

  <div class="metrics">
    <div class="metric-card score-card">
      <span class="label">SCORE</span>
      <span class="value">{{ session.score() }}</span>
    </div>
    <div class="metric-card timer-card">
      <span class="label">TIME</span>
      <span class="value">{{ session.timerText() }}</span>
    </div>
    <div class="metric-card moves-card">
      <span class="label">MOVES</span>
      <span class="value">{{ session.moves() }}</span>
    </div>
  </div>

  <div class="actions">
    <button
      class="btn btn-secondary"
      (click)="session.undo()"
      [disabled]="!session.canUndo()"
      title="Undo last move"
      aria-label="Undo last move"
    >
      <img src="icons/undo.svg" class="btn-icon" alt="Undo" />
      <span class="btn-text">Undo</span>
    </button>
    <button
      class="btn btn-secondary"
      (click)="session.restartGame()"
      title="Restart current game"
      aria-label="Restart current game"
    >
      <img src="icons/restart.svg" class="btn-icon" alt="Restart" />
      <span class="btn-text">Restart</span>
    </button>
    <button
      class="btn btn-primary"
      (click)="session.startNewGame()"
      title="Start a brand new game"
      aria-label="Start a brand new game"
    >
      <img src="icons/plus.svg" class="btn-icon" alt="New Game" />
      <span class="btn-text">New Game</span>
    </button>
    <button
      class="btn-circle btn-rules"
      (click)="docService.openHelp()"
      title="How to Play / Game Rules"
      aria-label="How to Play / Game Rules"
    >
      <img src="icons/help-circle.svg" class="btn-icon" alt="Help" />
    </button>
    <button
      class="btn-circle btn-settings"
      (click)="openSettings.emit()"
      title="Game Settings"
      aria-label="Game Settings"
    >
      <img src="icons/settings.svg" class="btn-icon" alt="Settings" />
    </button>
  </div>
</header>
