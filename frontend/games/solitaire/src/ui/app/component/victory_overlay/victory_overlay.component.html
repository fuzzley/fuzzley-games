<fz-dialog
  [open]="metrics.isGameWon()"
  dialogRole="alertdialog"
  label="You won"
  [dismissible]="false"
>
  <div class="victory-card">
    <div class="trophy-container">
      <div class="trophy-glow"></div>
      <fz-icon class="trophy-icon" name="trophy" />
    </div>
    <h2>Congratulations!</h2>
    <p class="victory-subtitle">You have successfully cleared the board!</p>

    <!--
      A description list, so each figure is announced with what it measures;
      the stylesheet lifts each value above its term.
    -->
    <dl class="victory-stats">
      <div class="v-stat">
        <dt class="v-lbl">Score</dt>
        <dd class="v-val">{{ metrics.score() }}</dd>
      </div>
      <div class="v-stat">
        <dt class="v-lbl">Time</dt>
        <dd class="v-val">{{ metrics.timerText() }}</dd>
      </div>
      <div class="v-stat">
        <dt class="v-lbl">Moves</dt>
        <dd class="v-val">{{ metrics.moves() }}</dd>
      </div>
    </dl>

    <div class="victory-actions">
      <button
        type="button"
        class="fz-button fz-button-warning fz-button-large fz-button-block"
        (click)="playAgain()"
      >
        Play Again
      </button>
      <!-- Opens over the card, which stays until a new game is dealt. -->
      <button
        type="button"
        class="fz-button fz-button-secondary fz-button-large fz-button-block"
        aria-haspopup="dialog"
        (click)="browser.open()"
      >
        Choose another game
      </button>
    </div>
  </div>
</fz-dialog>
