@if (session.isGameWon()) {
  <div class="victory-overlay">
    <div class="victory-card">
      <div class="trophy-container">
        <div class="trophy-glow"></div>
        <img src="icons/trophy.svg" class="trophy-icon" alt="Trophy" />
      </div>
      <h1>Congratulations!</h1>
      <p class="victory-subtitle">You have successfully cleared the board!</p>

      <div class="victory-stats">
        <div class="v-stat">
          <span class="v-val">{{ session.score() }}</span>
          <span class="v-lbl">Score</span>
        </div>
        <div class="v-stat">
          <span class="v-val">{{ session.timerText() }}</span>
          <span class="v-lbl">Time</span>
        </div>
        <div class="v-stat">
          <span class="v-val">{{ session.moves() }}</span>
          <span class="v-lbl">Moves</span>
        </div>
      </div>

      <button
        class="btn btn-gradient btn-large btn-block"
        (click)="session.startNewGame()"
      >
        Play Again
      </button>
    </div>
  </div>
}
