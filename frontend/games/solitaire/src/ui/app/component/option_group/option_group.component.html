<div class="setting">
  <span
    class="setting-label"
    [class.setting-label-compact]="compactLabel()"
    [id]="labelId"
    >{{ option().label }}</span
  >

  @if (listed()) {
    <!--
      Not an <fz-choice-list>, which names a choice by all its words: each is
      named by its name alone, so its line is read as a description.
    -->
    <div class="choice-list" fzRadioGroup [attr.aria-labelledby]="labelId">
      @for (choice of choices(); track choice.value) {
        <button
          type="button"
          class="choice"
          role="radio"
          [attr.aria-checked]="choice.checked"
          [attr.aria-labelledby]="choice.nameId"
          [attr.aria-describedby]="choice.descriptionId"
          (click)="choose.emit(choice.value)"
        >
          <span class="name" [id]="choice.nameId">{{ choice.label }}</span>
          @if (choice.descriptionId) {
            <span class="desc" [id]="choice.descriptionId">{{
              choice.description
            }}</span>
          }
        </button>
      }
    </div>
  } @else {
    <div class="segmented" fzRadioGroup [attr.aria-labelledby]="labelId">
      @for (choice of choices(); track choice.value) {
        <button
          type="button"
          class="segment"
          role="radio"
          [attr.aria-checked]="choice.checked"
          (click)="choose.emit(choice.value)"
        >
          {{ choice.label }}
        </button>
      }
    </div>

    @if (option().description) {
      <p class="setting-desc">{{ option().description }}</p>
    }
  }

  <!-- Whatever the host says about the setting, under its own words. -->
  <ng-content />
</div>
