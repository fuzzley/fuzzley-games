<!-- Only meaningful while the rail covers the board; hidden by CSS otherwise. -->
@if (menu.isExpanded()) {
  <div class="menu-backdrop" (click)="menu.setExpanded(false)"></div>
}

<button
  class="menu-toggle"
  [class.expanded]="menu.isExpanded()"
  (click)="menu.toggle()"
  [attr.aria-expanded]="menu.isExpanded()"
  [attr.aria-label]="
    menu.isExpanded() ? 'Collapse game menu' : 'Expand game menu'
  "
  title="Games"
>
  <img src="icons/menu.svg" class="toggle-icon" alt="Menu" />
  @if (menu.isExpanded()) {
    <span class="menu-title">Games</span>
  }
</button>

<nav class="game-menu" [class.expanded]="menu.isExpanded()">
  <ul class="game-list">
    @for (game of session.games; track game.id) {
      <li>
        <button
          class="game-item"
          [class.active]="session.selectedGameId() === game.id"
          [attr.aria-current]="session.selectedGameId() === game.id"
          (click)="chooseGame(game.id)"
          [title]="game.name"
        >
          <span class="game-marker">{{ game.name.charAt(0) }}</span>
          @if (menu.isExpanded()) {
            <span class="game-name">{{ game.name }}</span>
          }
        </button>
      </li>
    }
  </ul>
</nav>
