<!--
  Only meaningful while the rail covers the board; hidden by CSS otherwise.
  A button rather than a div: it is a real way to dismiss the menu, so it
  should be reachable by the keyboard rather than only by a tap.
-->
@if (menu.isExpanded()) {
  <button
    type="button"
    class="menu-backdrop"
    (click)="menu.setExpanded(false)"
    aria-label="Close game menu"
  ></button>
}

<button
  type="button"
  class="menu-toggle"
  [class.expanded]="menu.isExpanded()"
  (click)="menu.toggle()"
  [attr.aria-expanded]="menu.isExpanded()"
  aria-controls="game-menu-list"
  [attr.aria-label]="
    menu.isExpanded() ? 'Collapse game menu' : 'Expand game menu'
  "
>
  <svg
    class="toggle-icon"
    fill="currentColor"
    aria-hidden="true"
    viewBox="0 0 24 24"
  >
    <path d="M3 6h18v2H3V6m0 5h18v2H3v-2m0 5h18v2H3v-2Z" />
  </svg>
  @if (menu.isExpanded()) {
    <span class="menu-title">Games</span>
  }
</button>

<nav class="game-menu" [class.expanded]="menu.isExpanded()" aria-label="Games">
  <ul class="game-list" id="game-menu-list">
    @for (game of catalog.games; track game.id) {
      <li>
        <button
          type="button"
          class="game-item"
          [class.active]="catalog.selectedId() === game.id"
          [attr.aria-current]="catalog.selectedId() === game.id ? 'page' : null"
          (click)="chooseGame(game.id)"
          [title]="game.name"
        >
          <span class="game-marker" aria-hidden="true">{{
            game.name.charAt(0)
          }}</span>
          <span
            class="game-name"
            [class.visually-hidden]="!menu.isExpanded()"
            >{{ game.name }}</span
          >
        </button>
      </li>
    }
  </ul>
</nav>
