<!--
  The board first and the bar after it, as in Minesweeper: a <main> landmark
  a screen reader can jump to, under the bar, whose menu opens over it.
-->
<main class="stage">
  <div class="room">
    <app-board #board />
    <!--
      A key pressed with a pointer hands the focus back to the board, leaving
      the stage where it is scrolled to.
    -->
    <app-pad (handBack)="board.focus({ preventScroll: true })" />
  </div>
</main>

<app-bar
  (openHelp)="helpOpen.set(true)"
  (openSettings)="settingsOpen.set(true)"
/>

<!-- In the page from the start, so a screen reader is listening to it. -->
<fz-announcer />

<app-settings [open]="settingsOpen()" (closed)="settingsOpen.set(false)" />
<app-help [open]="helpOpen()" (closed)="helpOpen.set(false)" />
<app-result />
<fz-confirm-dialog />
