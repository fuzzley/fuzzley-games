<fz-game-bar
  [placement]="viewport.barPlacement()"
  [compact]="viewport.isCompact()"
  [home]="viewport.barHome()"
  [homeHref]="homeHref"
>
  <!-- The page's one <h1>, heard rather than seen on a compact screen. -->
  <h1
    fzBarTitle
    class="title"
    [class.fz-visually-hidden]="viewport.isCompact()"
  >
    Sudoku
  </h1>
  <!-- At every size, as the level isn't shown anywhere else in play. -->
  <fz-bar-choice
    fzBarTitle
    label="Level"
    [options]="levels"
    [value]="game.level()"
    (choose)="changeLevel($event)"
  />

  <!-- Not a live region: the clock would speak every second. -->
  <dl fzBarStatus class="metrics">
    <div class="metric">
      <dt><fz-icon name="time" /><span class="label">Time</span></dt>
      <dd class="value">{{ time() }}</dd>
    </div>
  </dl>

  <!--
    On a compact screen, Fill in notes, Restart, How to play and Settings
    move into the overflow menu. Each block holds one element, so it is
    projected into the actions as that element would be.
  -->
  @if (!viewport.isCompact()) {
    <button
      fzBarActions
      type="button"
      class="fz-button fz-button-secondary action"
      (click)="game.fillNotes()"
    >
      <fz-icon name="grid" />
      <span class="btn-text">Fill in notes</span>
    </button>
  }

  @if (!viewport.isCompact()) {
    <button
      fzBarActions
      type="button"
      class="fz-button fz-button-secondary action"
      (click)="game.restart()"
    >
      <fz-icon name="restart" />
      <span class="btn-text">Restart</span>
    </button>
  }

  <button
    fzBarActions
    type="button"
    class="fz-button action"
    [class.fz-button-circle]="viewport.isCompact()"
    (click)="game.newGame()"
  >
    <fz-icon name="plus" />
    <span class="btn-text">New Game</span>
  </button>

  @if (!viewport.isCompact()) {
    <button
      fzBarActions
      type="button"
      class="fz-button fz-button-secondary fz-button-circle action"
      aria-label="How to play"
      title="How to play"
      (click)="openHelp.emit()"
    >
      <fz-icon name="help" />
    </button>
  }

  @if (viewport.isCompact()) {
    <fz-bar-overflow
      fzBarActions
      [items]="overflowItems()"
      (choose)="chooseFromMenu($event)"
    />
  }

  @if (!viewport.isCompact()) {
    <button
      fzBarActions
      type="button"
      class="fz-button fz-button-secondary fz-button-circle action settings"
      aria-label="Settings"
      title="Settings"
      (click)="openSettings.emit()"
    >
      <fz-icon name="settings" />
    </button>
  }
</fz-game-bar>
