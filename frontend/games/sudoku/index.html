<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sudoku</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tints the mobile browser's chrome to match the page, Classic felt's
      until ThemeService sets the palette's own.
    -->
    <meta name="theme-color" content="#ffffff" />

    <!-- For search engines and link previews. -->
    <meta
      name="description"
      content="Sudoku, free in your browser, from Easy to Expert. Every puzzle can be solved without guessing. A hint shows the next square you can fill, and why."
    />
    <link rel="canonical" href="https://fuzzley.games/play/sudoku/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sudoku" />
    <meta
      property="og:description"
      content="Sudoku, free in your browser, from Easy to Expert. Every puzzle can be solved without guessing. A hint shows the next square you can fill, and why."
    />
    <meta property="og:url" content="https://fuzzley.games/play/sudoku/" />
    <meta
      property="og:image"
      content="https://fuzzley.games/play/sudoku/docs/screenshots/sudoku/preview.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1440" />
    <meta
      property="og:image:alt"
      content="A Sudoku game on Medium, partly filled in, with notes in some squares."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Sudoku",
        "url": "https://fuzzley.games/play/sudoku/",
        "description": "Sudoku, free in your browser, from Easy to Expert. Every puzzle can be solved without guessing. A hint shows the next square you can fill, and why.",
        "applicationCategory": "GameApplication",
        "genre": ["Puzzle", "Logic game"],
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

  <body>
    <app-root></app-root>
    <noscript>
      <h1>Sudoku</h1>
      <p>
        Fill the grid so every row, column and box has 1 to 9. Turn on
        JavaScript to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
