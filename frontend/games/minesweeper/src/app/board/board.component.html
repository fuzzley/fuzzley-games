<!--
  One listener for each kind of event, on the grid, which finds the square
  from the event's target. The grid takes focus itself (Angular Aria gives it
  a roving tab stop among the squares), which the lint rule asking for a
  focusable element can't see.
-->
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<div
  ngGrid
  appLongPress
  class="board"
  focusMode="roving"
  rowWrap="nowrap"
  colWrap="nowrap"
  [attr.aria-label]="label()"
  [style.--rows]="shape().rows"
  [style.--cols]="shape().cols"
  (click)="onClick($event)"
  (contextmenu)="onContextMenu($event)"
  (keydown)="onKeydown($event)"
  (longPress)="onLongPress($event)"
>
  @for (row of rows(); track $index) {
    <div ngGridRow class="row">
      @for (cell of row; track cell.index) {
        <div
          ngGridCell
          class="cell"
          [attr.data-index]="cell.index"
          [attr.data-show]="cell.showing"
          [attr.data-n]="cell.count"
          [attr.aria-label]="cell.label"
        >
          @switch (cell.showing) {
            @case ("number") {
              {{ cell.count }}
            }
            @case ("flagged") {
              <fz-icon name="flag" />
            }
            @case ("wrong-flag") {
              <fz-icon name="flag" />
            }
            @case ("tripped") {
              <fz-icon name="mine" />
            }
            @case ("mine") {
              <fz-icon name="mine" />
            }
          }
        </div>
      }
    </div>
  }
</div>
