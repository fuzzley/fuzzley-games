<!--
  The board first and the bar after it, as in the Solitaire Collection: a
  <main> landmark a screen reader can jump to, under the bar, whose menu
  opens over it.
-->
<main class="stage">
  <div class="room">
    <app-board />
  </div>
</main>

<app-game-bar
  (openHelp)="helpOpen.set(true)"
  (openSettings)="settingsOpen.set(true)"
/>

<!-- In the page from the start, so a screen reader is listening to it. -->
<p class="fz-visually-hidden" aria-live="polite">{{ game.announcement() }}</p>

<app-settings [open]="settingsOpen()" (closed)="settingsOpen.set(false)" />
<app-help [open]="helpOpen()" (closed)="helpOpen.set(false)" />
<app-result />
<!-- Last, so it opens over the settings when a change would lose a game. -->
<fz-confirm-dialog />
