<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Minesweeper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tints the mobile browser's chrome to match the page, Classic felt's
      until ThemeService sets the palette's own.
    -->
    <meta name="theme-color" content="#ffffff" />

    <!-- For search engines and link previews. -->
    <meta
      name="description"
      content="Minesweeper with lives, free in your browser. Hitting a mine costs a life instead of ending the game. Easy, Medium, Hard or a board of your own."
    />
    <link rel="canonical" href="https://fuzzley.games/play/minesweeper/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Minesweeper" />
    <meta
      property="og:description"
      content="Minesweeper with lives, free in your browser. Hitting a mine costs a life instead of ending the game. Easy, Medium, Hard or a board of your own."
    />
    <meta property="og:url" content="https://fuzzley.games/play/minesweeper/" />
    <meta
      property="og:image"
      content="https://fuzzley.games/play/minesweeper/docs/screenshots/minesweeper/preview.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1440" />
    <meta
      property="og:image:alt"
      content="A Medium Minesweeper field, half cleared, with flags, 1 mine hit and 2 lives left."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Minesweeper",
        "url": "https://fuzzley.games/play/minesweeper/",
        "description": "Minesweeper with lives, free in your browser. Hitting a mine costs a life instead of ending the game. Easy, Medium, Hard or a board of your own.",
        "applicationCategory": "GameApplication",
        "genre": ["Puzzle", "Logic game"],
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

  <body>
    <app-root></app-root>
    <noscript>
      <h1>Minesweeper</h1>
      <p>
        Clear the field using the numbers. Don’t hit a mine. Turn on JavaScript
        to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
