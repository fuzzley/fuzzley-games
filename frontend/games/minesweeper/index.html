<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Minesweeper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The palette the player chose on the site or in another game, which
      theme.js puts on the page before anything paints. A plain tag, at a
      relative URL like the build's other files: @fz/style's Vite plugin
      makes it, and vite-ignore tells Vite it isn't for bundling.
    -->
    <script src="theme.js" vite-ignore></script>
    <!--
      The fuzzball, which the same plugin makes in the default palettes'
      accents and ThemeService recolors to the one in use.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" vite-ignore />
    <!--
      Tints the mobile browser's chrome to match the page, Classic felt's
      until ThemeService sets the palette's own.
    -->
    <meta name="theme-color" content="#ffffff" />

    <!-- For search engines and link previews. -->
    <meta
      name="description"
      content="Play Minesweeper free in your browser, with lives: a mine costs one instead of the game. Easy, Medium, Hard or a field of your own, by mouse, touch or keyboard."
    />
    <link rel="canonical" href="https://fuzzley.games/play/minesweeper/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Minesweeper" />
    <meta
      property="og:description"
      content="Play Minesweeper free in your browser, with lives: a mine costs one instead of the game. Easy, Medium, Hard or a field of your own, by mouse, touch or keyboard."
    />
    <meta property="og:url" content="https://fuzzley.games/play/minesweeper/" />
    <meta
      property="og:image"
      content="https://fuzzley.games/play/minesweeper/docs/screenshots/minesweeper/preview.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1440" />
    <meta
      property="og:image:alt"
      content="A game of Minesweeper in progress, numbers and flags across the field, below the mines left, lives and time."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Minesweeper",
        "url": "https://fuzzley.games/play/minesweeper/",
        "description": "Play Minesweeper free in your browser, with lives: a mine costs one instead of the game. Easy, Medium, Hard or a field of your own, by mouse, touch or keyboard.",
        "applicationCategory": "GameApplication",
        "genre": ["Puzzle", "Logic game"],
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

  <body>
    <app-root></app-root>
    <noscript>
      <h1>Minesweeper</h1>
      <p>
        Minesweeper with lives, free to play in your browser. Turn on JavaScript
        to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
