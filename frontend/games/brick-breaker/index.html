<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Brick Breaker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The palette the player chose on the site or in another game, which
      theme.js puts on the page before anything paints. A plain tag, at a
      relative URL like the build's other files: @fz/style's Vite plugin
      makes it, and vite-ignore tells Vite it isn't for bundling.
    -->
    <script src="theme.js" vite-ignore></script>
    <!--
      The fuzzball, which the same plugin makes in the default palettes'
      accents and ThemeService recolors to the one in use. The ICO and the
      home screen icon are for what draws no SVG; the ICO's sizes keeps a
      browser that draws both from picking it.
    -->
    <link rel="icon" href="favicon.ico" sizes="32x32" vite-ignore />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" vite-ignore />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" vite-ignore />
    <!--
      Tints the mobile browser's chrome to match the page, Classic felt's
      until ThemeService sets the palette's own.
    -->
    <meta name="theme-color" content="#ffffff" />

    <!-- For search engines and link previews. -->
    <meta
      name="description"
      content="Play Brick Breaker free in your browser: bounce the ball off your paddle, break every brick and keep the ball off the floor. Thirty levels, three speeds, by mouse, keyboard or touch."
    />
    <link rel="canonical" href="https://fuzzley.games/play/brick-breaker/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brick Breaker" />
    <meta
      property="og:description"
      content="Play Brick Breaker free in your browser: bounce the ball off your paddle, break every brick and keep the ball off the floor. Thirty levels, three speeds, by mouse, keyboard or touch."
    />
    <meta
      property="og:url"
      content="https://fuzzley.games/play/brick-breaker/"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Brick Breaker",
        "url": "https://fuzzley.games/play/brick-breaker/",
        "description": "Play Brick Breaker free in your browser: bounce the ball off your paddle, break every brick and keep the ball off the floor. Thirty levels, three speeds, by mouse, keyboard or touch.",
        "applicationCategory": "GameApplication",
        "genre": ["Arcade", "Action game"],
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

  <body>
    <app-root></app-root>
    <noscript>
      <h1>Brick Breaker</h1>
      <p>
        Brick Breaker, free to play in your browser: bounce the ball, break
        every brick, and keep it off the floor. Turn on JavaScript to play.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
