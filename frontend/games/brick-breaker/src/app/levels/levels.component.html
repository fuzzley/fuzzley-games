<fz-dialog [open]="open()" label="Levels" (closed)="closed.emit()">
  <div class="card">
    <button
      type="button"
      class="close"
      aria-label="Close levels"
      (click)="closed.emit()"
    >
      <fz-icon name="close" />
    </button>
    <h2>Levels</h2>
    <p>
      Choose a level to start a run there. Clearing one opens the next; each
      shows its best at the speed in play.
    </p>

    @for (set of sets(); track set.id) {
      <section [attr.aria-labelledby]="set.headingId">
        <h3 [id]="set.headingId">{{ set.name }}</h3>
        <ul class="grid">
          @for (level of set.levels; track level.number) {
            <li>
              <!--
                Named by its number and its name, "1 Blasts", as a voice
                command reads it, then what it says under them: `&ngsp;`
                keeps the spaces between them, which a template otherwise
                drops. A locked level is marked `aria-disabled` rather than
                disabled, so it is still found and read.
              -->
              <button
                type="button"
                class="level"
                [attr.aria-current]="level.current ? 'true' : null"
                [attr.aria-disabled]="level.open ? null : 'true'"
                (click)="choose(level)"
              >
                <span class="head"
                  ><span class="number">{{ level.number }}</span>
                  @if (level.cleared) {
                    <fz-icon name="tick" />
                  }</span
                >&ngsp;<span class="name">{{ level.name }}</span>
                @if (level.status; as status) {
                  &ngsp;<span class="status">{{ status }}</span>
                }
              </button>
            </li>
          }
        </ul>
      </section>
    }
  </div>
</fz-dialog>
