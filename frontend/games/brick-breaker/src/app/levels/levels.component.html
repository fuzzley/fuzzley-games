<fz-levels
  [open]="open()"
  [intro]="shown().intro"
  [marks]="shown().marks"
  [current]="current()"
  [levels]="levels"
  [mostStars]="mostStars"
  figure="Best"
  (chosen)="startAt($event)"
  (closed)="closed.emit()"
>
  <!--
    Named by its number and its name, "1 Blasts", as a voice command reads
    it, then its stars and what it says under them: `&ngsp;` keeps the spaces
    between them, which a template otherwise drops.
  -->
  <ng-template fzLevelTile let-level>
    @if (shown().tiles[level.id]; as tile) {
      <span class="head"
        ><span class="number">{{ level.number }}</span>
        @if (tile.cleared) {
          <fz-icon name="tick" />
        }</span
      >&ngsp;<span class="name">{{ level.name }}</span
      >&ngsp;<span class="stars">
        @for (star of tile.stars; track star.id) {
          <fz-icon [name]="star.icon" [attr.data-held]="star.held" />
        }
        <span class="fz-visually-hidden">{{ level.starsWords }}</span></span
      >
      @if (tile.status; as status) {
        &ngsp;<span class="status">{{ status }}</span>
      }
    }
  </ng-template>
  <ng-template fzLevelSetNote let-set>
    <p class="count">
      <fz-icon name="star" />{{ shown().setStars[set.id]
      }}<span class="fz-visually-hidden"> stars</span>
    </p>
  </ng-template>
</fz-levels>
