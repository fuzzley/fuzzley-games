<!--
  The board first and the bar after it, as in the other games: a <main>
  landmark a screen reader can jump to, under the bar, whose menu opens over
  it.
-->
<main class="stage">
  <div class="room" fzPlayRoom (away)="pauseRun()">
    <app-board #board />
  </div>
</main>

<app-bar
  (openSectors)="sectorsOpen.set(true)"
  (openHelp)="helpOpen.set(true)"
  (openSettings)="settingsOpen.set(true)"
  (handBack)="board.focus()"
/>

<!-- In the page from the start, so a screen reader is listening to it. -->
<fz-announcer />

<!--
  The result card before the sectors: its Choose a sector puts it away as it
  opens them, and the dialogs open and close in this order, so the card gives
  the focus back before the sectors take it.
-->
<app-result (chooseSector)="sectorsOpen.set(true)" />
<app-sectors [open]="sectorsOpen()" (closed)="sectorsOpen.set(false)" />
<app-help
  [open]="helpOpen()"
  [pictures]="helpPictures()"
  (closed)="helpOpen.set(false)"
/>
<app-settings [open]="settingsOpen()" (closed)="settingsOpen.set(false)" />
<fz-confirm-dialog />
