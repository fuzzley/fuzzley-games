<fz-phaser-canvas #canvas [scene]="scene" [options]="hostOptions">
  <!-- The empty field, where the scene will draw it, until it does. -->
  <div fzCanvasPlaceholder class="placeholder" aria-hidden="true">
    <div class="field" [style]="fieldStyle()"></div>
  </div>
</fz-phaser-canvas>
<div class="ring" [style]="fieldStyle()"></div>

<p id="board-keys" class="fz-visually-hidden">
  Left and Right, or A and D: turn the ship. Up or W: thrust. Space: fire.
  Shift, Down or S: dash. P: pause and resume. Esc: pause. Enter: resume, or go
  to the next wave. Any key you fly with also resumes, or goes to the next wave.
</p>

<app-board-card
  [style]="fieldStyle()"
  [board]="board()"
  (handBack)="takeFocusBack()"
>
  <!-- Still loading, and couldn't be drawn: the canvas's own cards. -->
  <fz-canvas-cards [canvas]="canvas" />
</app-board-card>
