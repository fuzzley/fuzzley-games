<fz-dialog
  [open]="game.resultOpen()"
  dialogRole="alertdialog"
  label="Game over"
  describedBy="result-subtitle"
  [closesOnBackdrop]="false"
  (closed)="game.closeResult()"
>
  <div class="card">
    @if (game.newBest()) {
      <fz-icon class="card-icon" name="trophy" />
    }
    <!--
      The card opens on its title, which no key presses: Space fires, and a
      player still firing as the card opens would press a button with it.
      The lint rule is about autofocus on page load, which a dialog taking
      focus is not.
    -->
    <!-- eslint-disable-next-line @angular-eslint/template/no-autofocus -->
    <h2 tabindex="-1" autofocus>Game over</h2>
    <p class="subtitle">
      <span id="result-subtitle">{{ subtitle() }}</span>
      @if (game.newBest()) {
        <span class="fz-badge fz-badge-accent">New best</span>
      }
    </p>

    <!--
      A description list, so each figure is announced with what it measures;
      the stylesheet lifts each value above its term.
    -->
    <dl class="figures">
      @for (figure of figures(); track figure.term) {
        <div class="figure">
          <dt>{{ figure.term }}</dt>
          <dd>{{ figure.value }}</dd>
        </div>
      }
    </dl>

    @if (broughtAny()) {
      <app-pilot-row class="home" [pilots]="game.broughtHome()">
        {{ homeWords() }}
      </app-pilot-row>
    }

    <div class="actions">
      <button
        type="button"
        class="fz-button fz-button-warning fz-button-large fz-button-block"
        (click)="game.tryAgain()"
      >
        {{ againLabel() }}
      </button>
      <button
        type="button"
        class="fz-button fz-button-secondary fz-button-large fz-button-block"
        (click)="game.closeResult()"
      >
        Close
      </button>
    </div>
  </div>
</fz-dialog>
