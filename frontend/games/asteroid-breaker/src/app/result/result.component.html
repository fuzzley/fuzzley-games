<fz-dialog
  [open]="game.resultOpen()"
  dialogRole="alertdialog"
  [label]="title"
  describedBy="result-description"
  [closesOnBackdrop]="false"
  (closed)="game.closeResult()"
>
  <div class="card">
    @if (game.newBest()) {
      <fz-icon class="card-icon" name="trophy" />
    }
    <!--
      The card opens on its title, which no key presses: Space fires, and a
      player still firing as the card opens would press a button with it.
      The lint rule is about autofocus on page load, which a dialog taking
      focus is not.
    -->
    <!-- eslint-disable-next-line @angular-eslint/template/no-autofocus -->
    <h2 tabindex="-1" autofocus>{{ title }}</h2>
    <p class="subtitle">
      <span>{{ subtitle() }}</span>
      @if (game.newBest()) {
        <span class="fz-badge fz-badge-accent">New best</span>
      }
      @if (game.clearedAll()) {
        <span class="fz-badge fz-badge-accent">All 30 waves cleared!</span>
      }
    </p>
    <!--
      What a screen reader hears of the card as it opens, kept out of the
      way of one reading the card through. The card hides the page's
      announcer a moment after the run's end is said there, or on the next
      frame where motion isn't welcome, cutting the words short or losing
      them, so this says the score and what the run set again.
    -->
    <p id="result-description" hidden>{{ description() }}</p>

    <!--
      A description list, so each figure is announced with what it measures;
      the stylesheet lifts each value above its term.
    -->
    <dl class="figures">
      @for (figure of figures(); track figure.term) {
        <div class="figure">
          <dt>{{ figure.term }}</dt>
          <dd>{{ figure.value }}</dd>
        </div>
      }
    </dl>

    <div class="flew">
      <p class="label">The fuzzballs who flew</p>
      <app-pilot-row [pilots]="flew()">
        <span class="fz-visually-hidden">{{ flewWords() }}</span>
      </app-pilot-row>
    </div>

    <div class="actions">
      <button
        type="button"
        class="fz-button fz-button-warning fz-button-large fz-button-block"
        (click)="game.tryAgain()"
      >
        {{ againLabel() }}
      </button>
      <button
        type="button"
        class="fz-button fz-button-secondary fz-button-large fz-button-block"
        (click)="chooseFromSectors()"
      >
        Choose a sector
      </button>
      <button
        type="button"
        class="fz-button fz-button-secondary fz-button-large fz-button-block"
        (click)="game.closeResult()"
      >
        Close
      </button>
    </div>
  </div>
</fz-dialog>
