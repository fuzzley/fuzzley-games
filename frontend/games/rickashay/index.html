    <meta property="og:title" content="Rickaashay" />

      property="og:description"
      content="Rickaashay, free in your browser. Aim the fuzzball, and it bounces off every wall and brick. The more bricks a shot hits, the more you score."

    <meta property="og:url" content="https://fuzzley.games/play/rickashay/" />
