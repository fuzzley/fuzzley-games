<!--
  The board first and the bar after it, as in the other games: a <main>
  landmark a screen reader can jump to, under the bar, whose menu opens over
  it.
-->
<main class="stage">
  <div class="room" fzPlayRoom (away)="game.lookAway($event)">
    <app-board #board />
  </div>
</main>

<app-bar
  [level]="game.run().level"
  [rounds]="game.rounds()"
  [par]="game.par()"
  [rowsLeft]="game.rowsLeft()"
  [bestRally]="game.bestRally()"
  [rallyMark]="game.rallyMark()"
  [score]="game.score()"
  [outcome]="game.outcome()"
  [aiming]="game.aiming()"
  [flying]="game.flying()"
  [releaseByButton]="game.releaseByButton()"
  [fast]="game.fast()"
  [soundOn]="game.soundOn()"
  (pauseRun)="game.pause()"
  (resumeRun)="resumeRun()"
  (nudge)="board.nudge($event)"
  (releaseShot)="board.releaseShot()"
  (fastForward)="game.fastForward()"
  (skipFlight)="game.landAtOnce()"
  (toggleSound)="game.toggleSound()"
  (openLevels)="levelsOpen.set(true)"
  (newGame)="newGame()"
  (openSettings)="settingsOpen.set(true)"
/>

<!-- In the page from the start, so a screen reader is listening to it. -->
<fz-announcer />

<!--
  The result card before the Levels dialog: its Choose a level puts it away
  as it opens the dialog, and the dialogs open and close in this order, so
  the card gives the focus back before the dialog takes it.
-->
@if (lastEnd(); as end) {
  <fz-result
    [open]="game.resultOpen()"
    [end]="end"
    [best]="game.best()"
    [newBest]="game.newBest()"
    (tryAgain)="game.tryAgain()"
    (newGame)="newGame()"
    (chooseLevel)="chooseLevel()"
    (closed)="game.closeResult()"
  />
}
<fz-levels
  [open]="levelsOpen()"
  [marks]="marks()"
  [current]="game.run().level"
  [levels]="levels"
  [mostStars]="mostStars"
  figure="Best rally"
  (chosen)="startAt($event)"
  (closed)="levelsOpen.set(false)"
/>
<fz-settings-drawer [open]="settingsOpen()" (closed)="settingsOpen.set(false)">
  <fz-theme-picker />
  <!--
    A bug report's game state, pasted to load, where the game offers its
    debug menu: in a development build, and on the site at ?debug.
  -->
  <fz-bug-report-loader (loaded)="settingsOpen.set(false)">
    <p class="setting-desc">
      Loading a game state also sets the field's depth. Use the build named in
      the report.
    </p>
  </fz-bug-report-loader>
</fz-settings-drawer>
<fz-bug-report-dialog [touch]="viewport.isTouchScreen()" />
<fz-confirm-dialog />
