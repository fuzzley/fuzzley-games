nodeLinker: node-modules

packageExtensions:
  # Only Analog's `ng test` builder and `ng add` schematic use these; the
  # Vitest setup the Solitaire Collection imports does not.
  "@analogjs/vitest-angular@*":
    peerDependenciesMeta:
      "@angular-devkit/architect":
        optional: true
      "@angular-devkit/schematics":
        optional: true

# Don't install a package version published less than a day ago (in minutes),
# so a compromised release has time to be caught and pulled before it lands
# here. Dependabot's cooldown matches.
npmMinimalAgeGate: 1440
