<button
  class="trigger"
  type="button"
  aria-controls="theme-options"
  [attr.aria-expanded]="open()"
  (click)="toggle()"
>
  <span class="swatch" [attr.data-theme]="current()" aria-hidden="true"></span>
  <span class="label">Theme</span>
  <span class="visually-hidden">: {{ currentName() }}</span>
</button>

<div id="theme-options" class="panel" [hidden]="!open()">
  <p class="panel-title">Theme</p>
  <ul>
    @for (theme of themes; track theme.id) {
      <li>
        <button
          class="option"
          type="button"
          [attr.aria-pressed]="theme.id === current()"
          (click)="choose(theme.id)"
        >
          <span
            class="swatch large"
            [attr.data-theme]="theme.id"
            aria-hidden="true"
          ></span>
          <span class="name">{{ theme.name }}</span>
          <span class="mode">{{
            theme.mode === "dark" ? "Dark" : "Light"
          }}</span>
          @if (theme.id === current()) {
            <app-icon class="tick" name="tick" />
          }
        </button>
      </li>
    }
  </ul>
</div>
