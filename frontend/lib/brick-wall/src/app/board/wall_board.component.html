<div
  #play
  class="play"
  role="application"
  tabindex="0"
  aria-roledescription="game board"
  aria-describedby="fz-board-keys"
  [attr.aria-label]="label()"
  (pointerdown)="takeFocusForPress()"
>
  <fz-phaser-canvas [scene]="source" [options]="hostOptions()">
    <!-- The empty field, where the scene will draw it, until it does. -->
    <div fzCanvasPlaceholder class="placeholder" aria-hidden="true">
      <div class="field" [style]="fieldStyle()"></div>
    </div>
  </fz-phaser-canvas>
  <div class="ring" [style]="fieldStyle()"></div>
</div>

<!--
  How many rows wait over the ceiling, on the lintel, read as the page is
  where nothing else in it says so, and no live region, as the announcer is
  the page's one, and the game says the count there as it changes.
-->
@if (lintelStyle(); as lintel) {
  <p class="lintel" [style]="lintel" [attr.aria-hidden]="lintelHidden()">
    {{ waiting() }}
  </p>
}

<!--
  The keys needed to play, one at a time, which describe the application.
  `role="list"`, as Safari's VoiceOver stops calling a list with no markers
  one.
-->
<ul id="fz-board-keys" class="fz-visually-hidden" role="list" aria-label="Keys">
  @for (key of keys(); track $index) {
    <li>{{ key }}</li>
  }
</ul>

<!--
  The game's panels and its card, laid where the board says, outside the
  application, read as a page is.
-->
<ng-content />
