<h2 id="fz-coming-next-title" class="card-title">Coming next</h2>
<p class="level">{{ title() }}</p>
<div class="rows" aria-hidden="true">
  @for (row of rows(); track $index) {
    <span class="row">
      @for (ink of row; track $index) {
        <span class="square" [style.--ink]="ink"></span>
      }
    </span>
  }
</div>
<p>{{ waiting() }}</p>
<p>{{ jump() }}</p>
