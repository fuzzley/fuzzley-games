<button
  class="trigger"
  type="button"
  [class.compact]="compact()"
  ngMenuTrigger
  [menu]="menu"
  [attr.aria-label]="label()"
>
  <span class="fz-swatch" [attr.data-theme]="current()"></span>
  @if (!compact()) {
    <span class="label" aria-hidden="true">Theme</span>
  }
</button>

<div
  ngMenu
  #menu="ngMenu"
  class="panel"
  aria-label="Theme"
  (itemSelected)="choose($event)"
>
  <ng-template ngMenuContent>
    <p class="panel-title" aria-hidden="true">Theme</p>
    @for (option of options(); track option.id) {
      <div
        ngMenuItem
        class="option"
        role="menuitemradio"
        [value]="option.id"
        [searchTerm]="option.name"
        [attr.aria-checked]="option.checked"
      >
        <span
          class="fz-swatch fz-swatch-large"
          [attr.data-theme]="option.id"
        ></span>
        <span class="name">{{ option.name }}</span>
        <span class="mode">{{ option.modeName }}</span>
        @if (option.checked) {
          <fz-icon class="tick" name="tick" />
        }
      </div>
    }
  </ng-template>
</div>
