<div class="options" role="radiogroup" [attr.aria-label]="label()">
  @for (option of options(); track option.id) {
    <label class="option">
      <input
        class="fz-visually-hidden"
        type="radio"
        [name]="group"
        [value]="option.id"
        [checked]="option.checked"
        (change)="theme.select(option.id)"
      />
      <span
        class="fz-swatch fz-swatch-large"
        [attr.data-theme]="option.id"
      ></span>
      <span class="text">
        <span class="name">{{ option.name }}</span>
        <span class="mode">{{ option.modeName }}</span>
      </span>
      @if (option.checked) {
        <fz-icon class="tick" name="tick" />
      }
    </label>
  }
</div>
