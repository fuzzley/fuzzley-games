<svg [attr.viewBox]="mark.viewBox" focusable="false">
  <circle
    class="body"
    fill="currentcolor"
    [attr.cx]="mark.body.cx"
    [attr.cy]="mark.body.cy"
    [attr.r]="mark.body.r"
  />
  <path
    class="fur"
    fill="none"
    stroke="currentcolor"
    stroke-linecap="round"
    [attr.d]="mark.fur.d"
    [attr.stroke-width]="mark.fur.width"
  />
  @for (eye of mark.eyes; track $index) {
    <ellipse
      [attr.cx]="eye.cx"
      [attr.cy]="eye.cy"
      [attr.rx]="eye.rx"
      [attr.ry]="eye.ry"
      [attr.fill]="mark.ink"
      [style.fill]="eyes"
    />
  }
  @for (glint of mark.glints; track $index) {
    <circle
      class="glint"
      [attr.cx]="glint.cx"
      [attr.cy]="glint.cy"
      [attr.r]="glint.r"
      [attr.fill]="mark.glint"
    />
  }
</svg>
