<section [attr.aria-labelledby]="headingId">
  <h3 [id]="headingId">{{ catalog().heading }}</h3>
  @if (catalog().intro; as intro) {
    <p>{{ intro }}</p>
  }
  <!-- `role="list"`, as Safari's VoiceOver stops calling a list with no markers one. -->
  <ul class="catalog" role="list">
    @for (entry of catalog().entries; track entry.id) {
      <li>
        @if (entry.picture; as picture) {
          <img [src]="picture" alt="" />
        }
        <div>
          <strong>{{ entry.name }}.</strong>
          {{ entry.about }}
        </div>
      </li>
    }
  </ul>
</section>
