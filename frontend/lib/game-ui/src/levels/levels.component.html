<fz-dialog [open]="open()" label="Levels" (closed)="closed.emit()">
  <div class="card">
    <button
      type="button"
      class="close"
      aria-label="Close levels"
      (click)="closed.emit()"
    >
      <fz-icon name="close" />
    </button>
    <h2>Levels</h2>
    @for (paragraph of intro(); track $index) {
      <p>{{ paragraph }}</p>
    }

    @for (set of sets(); track set.id) {
      <section [attr.aria-labelledby]="set.headingId">
        <h3 [id]="set.headingId">{{ set.name }}</h3>
        <!-- `role="list"`, as Safari's VoiceOver stops calling a list with no markers one. -->
        <ul class="grid" role="list">
          @for (level of set.levels; track level.number) {
            <li>
              <!--
                A locked level is marked `aria-disabled` rather than
                disabled, so it is still found and read.
              -->
              <button
                type="button"
                class="level"
                [attr.aria-current]="level.current ? 'true' : null"
                [attr.aria-disabled]="level.open ? null : 'true'"
                (click)="choose(level)"
              >
                @if (tile(); as gameTile) {
                  <ng-container
                    [ngTemplateOutlet]="gameTile.template"
                    [ngTemplateOutletContext]="{ $implicit: level }"
                  />
                } @else {
                  <!--
                    Named by its number and its name, "1 Gravel", as a
                    voice command reads it, then its stars and what it says
                    under them: `&ngsp;` keeps the spaces between them,
                    which a template otherwise drops.
                  -->
                  <span class="number">{{ level.number }}</span>&ngsp;<span
                    class="name"
                    >{{ level.name }}</span
                  >
                  @if (level.cleared) {
                    &ngsp;<span class="stars">
                      @for (star of level.stars; track star) {
                        <fz-icon name="star" />
                      }
                      <span class="fz-visually-hidden">{{
                        level.starsWords
                      }}</span></span
                    >
                  }
                  @if (level.status; as status) {
                    &ngsp;<span class="status">{{ status }}</span>
                  }
                }
              </button>
            </li>
          }
        </ul>
      </section>
    }
  </div>
</fz-dialog>
