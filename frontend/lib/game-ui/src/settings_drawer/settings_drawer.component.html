<fz-dialog [open]="open()" label="Settings" (closed)="closed.emit()">
  <div class="drawer">
    <div class="drawer-header">
      <h2>Settings</h2>
      <button
        type="button"
        class="close"
        aria-label="Close settings"
        (click)="closed.emit()"
      >
        <fz-icon name="close" />
      </button>
    </div>

    <div class="drawer-content">
      <ng-content />
    </div>
  </div>
</fz-dialog>
