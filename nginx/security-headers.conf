# The headers every response carries, errors too ("always").
#
# nginx drops the add_header lines a server or location inherits as soon as a
# location adds one of its own, so every location in nginx.conf.template that
# sets Cache-Control includes this file, and the server block includes it for
# the rest.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Browsers ignore it over plain HTTP, so it costs nothing on a local run.
add_header Strict-Transport-Security "max-age=31536000" always;
