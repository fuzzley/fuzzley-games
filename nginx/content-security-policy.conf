# The Content Security Policy of the site's own pages. The games under /play/
# load what their engines need, which this policy isn't written for, so they
# go without one.
#
#   script-src   the site's own files (no inline script: theme.js, env.js and
#                analytics.js are files) and Google Analytics' gtag.js
#   style-src    'unsafe-inline' because Angular adds each component's styles
#                as a <style> element
#   font-src     the site's own files: Figtree comes with @fz/style
#   img-src,     Google Analytics' measurement endpoints, as Google lists them
#   connect-src
#
# Include it after security-headers.conf, in a location that serves pages.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
