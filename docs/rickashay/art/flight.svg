<text x="40" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#e6edf7">Cut corners</text>
<text x="40" y="64" font-family="system-ui, sans-serif" font-size="14.5" fill="#93a4bd">The dashed line is where a fuzzball's middle turns.</text>
<text x="40" y="150" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#4cc3ff">Off a face:</text>
<text x="40" y="169" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#4cc3ff">a mirror</text>
<text x="372" y="262" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24">Off a corner:</text>
<text x="372" y="281" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24">its two speeds</text>
<text x="372" y="300" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#fbbf24">change places</text>
<text x="40" y="470" font-family="system-ui, sans-serif" font-size="14.5" fill="#93a4bd">A quarter of a unit off each face, the fuzzball's</text>
<text x="40" y="490" font-family="system-ui, sans-serif" font-size="14.5" fill="#93a4bd">radius, and straight across each corner at 45°.</text></g>
<g transform="translate(592 116)"><rect x="0" y="0" width="500" height="520" rx="18" fill="#0e1a2b"/><text x="40" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#e6edf7">Eight directions</text>
<text x="40" y="64" font-family="system-ui, sans-serif" font-size="14.5" fill="#93a4bd">All a flight aimed at 62° ever flies in.</text>
