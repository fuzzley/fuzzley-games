<text x="48" y="64" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#e6edf7">Rickashay: how a flight turns</text>
<text x="48" y="96" font-family="system-ui, sans-serif" font-size="17" fill="#93a4bd">Every turn is a change of sign or a swap of the fuzzball's two speeds, so its arithmetic is exact and a nudge of the aim moves a bounce a little, not somewhere else.</text>
