<text x="332.42" y="131.56" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#4cc3ff">the aim, 62°</text>
<rect x="40" y="458" width="16" height="5" fill="#4cc3ff"/>
<text x="64" y="465" font-family="system-ui, sans-serif" font-size="14.5" fill="#e6edf7">The aim, mirrored: off a face, a wall, the ceiling</text>
<rect x="40" y="483" width="16" height="5" fill="#fbbf24"/>
<text x="64" y="490" font-family="system-ui, sans-serif" font-size="14.5" fill="#e6edf7">The aim, swapped: off a corner, a ramp, a gem</text></g>
<g transform="translate(1116 116)"><rect x="0" y="0" width="580" height="520" rx="18" fill="#0e1a2b"/><text x="40" y="40" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#e6edf7">Shallow for columns, steep for rows</text>
<text x="40" y="64" font-family="system-ui, sans-serif" font-size="14.5" fill="#93a4bd">The same two aims, to scale, through a gap five long.</text>
<text x="60" y="116" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#e6edf7">Up a chimney</text>
