<text x="314" y="306" font-family="system-ui, sans-serif" font-size="14.5" fill="#e6edf7">Aimed at 24°: 22 strikes up the</text>
<text x="314" y="326" font-family="system-ui, sans-serif" font-size="14.5" fill="#e6edf7">chimney, 4 along the gap</text>
<rect x="290" y="355" width="16" height="5" fill="#4cc3ff"/>
<text x="314" y="362" font-family="system-ui, sans-serif" font-size="14.5" fill="#e6edf7">Aimed at 66°: 4 up the chimney,</text>
<text x="314" y="382" font-family="system-ui, sans-serif" font-size="14.5" fill="#e6edf7">22 along the gap</text>
<text x="40" y="450" font-family="system-ui, sans-serif" font-size="14.5" fill="#93a4bd">A shallow flight crosses fast, so it works the sides of columns.</text>
<text x="40" y="470" font-family="system-ui, sans-serif" font-size="14.5" fill="#93a4bd">A steep one climbs fast, so it works rows from under and over.</text>
<text x="40" y="490" font-family="system-ui, sans-serif" font-size="14.5" fill="#93a4bd">A 45° face turns one into the other.</text></g>
