 * @returns {string}

 * @param {object} o

 * @param {number} o.seed
 * @param {number} [o.lift] 0 at rest to 1 with the fur on end.

 * @returns {Shape}

  for (let i = 0; i < count; i++) {

    }
    case "amber": {
      // A short coat under a top-knot that curls over to one side.
      const knot = [
        strand(-Math.PI / 2 - 0.13, R * 0.7, R * 1.5, 0.42),
        strand(-Math.PI / 2, R * 0.7, R * 1.86, 0.4),
        strand(-Math.PI / 2 + 0.13, R * 0.7, R * 1.62, 0.5),
      ].join("");
      return [
        coat({
          count: 24,
          reach: 1.13,
          vary: 0.08,
          bend: 0.16,
          seed: 23,
          lift,
        }),
        { k: "stroke", d: knot, c: "ink", w: R * 0.26 * (1 + lift * 0.1) },
      ];
    }
    case "green": {
      // Nine curls, a scalloped edge like a sheep's.
      const shapes = [];
      const n = 9;
      for (let i = 0; i < n; i++) {
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        const [x, y] = polar(angle, R * (0.88 + lift * 0.1));
        shapes.push(
          /** @type {Shape} */ ({
            k: "circle",
            x: f(x),
            y: f(y),
            r: f(R * (0.36 + lift * 0.03)),
            c: "ink",
          }),
        );
      }
      return shapes;
    }
    case "violet": {
      // A short coat over the top and a long fringe hanging under it.
      const rand = rng(41);
      const parts = [];
      const n = 7;
      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);
        const x0 = R * (-0.78 + 1.56 * t);
        const y0 = R * (0.18 + 0.42 * Math.sin(t * Math.PI));
        const length = R * (0.74 + 0.36 * Math.sin(t * Math.PI) + rand() * 0.1);
        const splay = (t - 0.5) * R * (0.34 + lift * 0.5);
        parts.push(
          `M${f(x0)} ${f(y0)}Q${f(x0 + splay * 0.3)} ${f(y0 + length * 0.6)} ${f(x0 + splay)} ${f(y0 + length * (1 - lift * 0.12))}`,
        );
      }
      return [
        coat({
          count: 15,
          reach: 1.13,
          vary: 0.08,
          bend: 0.14,
          seed: 37,
          lift,
          from: Math.PI * 0.98,
          to: Math.PI * 2.02,
        }),
        { k: "stroke", d: parts.join(""), c: "ink", w: R * 0.3 },
      ];
    }
    case "pink": {
      // A short coat and two tufts, one each side of the crown.
      const tufts = [-1, 1]
        .map((side) => {
          const a = -Math.PI / 2 + side * 0.56;
          return [
            strand(a - side * 0.15, R * 0.7, R * 1.46, -side * 0.04),
            strand(a, R * 0.7, R * 1.8, side * 0.05),
            strand(a + side * 0.15, R * 0.7, R * 1.52, side * 0.12),
          ].join("");
        })
        .join("");
      return [
        coat({
          count: 24,
          reach: 1.13,
          vary: 0.08,
          bend: 0.16,
          seed: 53,
          lift,
        }),
        { k: "stroke", d: tufts, c: "ink", w: R * 0.27 * (1 + lift * 0.1) },
      ];
    }
    default:
      throw new Error(`No fur for ${kind}`);
  }
}

/**
 * Returns how far a kind's body sits from its cell's center, so that the
 * whole fuzzball, fur and all, looks centered.
 * @param {KindId} kind
 * @returns {[number, number]}
 */
function seat(kind) {
  if (kind === "amber") return [0, R * 0.24];
  if (kind === "violet") return [0, -R * 0.22];
  if (kind === "pink") return [0, R * 0.22];
  return [0, 0];
}

/**
 * Returns a fuzzball's body, the disc its fur grows from.
 * @param {Role | string} [c]
 * @returns {Shape[]}
 */
function body(c = "ink") {
  return [{ k: "circle", x: 0, y: 0, r: R, c }];
}

/**
 * Returns a fuzzball's eyes.
 * @param {EyeLook} [look]
 * @param {number} [dx] Where it looks, from -1 at the far left to 1.
 * @param {number} [dy] Where it looks, from -1 at the top to 1.
 * @param {{ white: Role | string, pupil: Role | string } | null} [inverted]
 *   For a fuzzball too dark for dark eyes: the colors of its eyes' whites and
 *   their pupils.
 * @returns {Shape[]}
 */
function eyes(look = "open", dx = 0, dy = 0, inverted = null) {
  const ex = R * 0.35;
  const ey = -R * 0.02;
  const ox = dx * R * 0.13;
  const oy = dy * R * 0.11;
  const eye = inverted ? inverted.white : "eye";
  /** @type {Shape[]} */
  const shapes = [];
  for (const side of [-1, 1]) {
    const x = side * ex + ox;
    const y = ey + oy;
    if (look === "blink") {
      shapes.push({
        k: "stroke",
        d: `M${f(x - R * 0.2)} ${f(y)}L${f(x + R * 0.2)} ${f(y)}`,
        c: eye,
        w: R * 0.11,
      });
    } else if (look === "happy") {
      shapes.push({
        k: "stroke",
        d: `M${f(x - R * 0.2)} ${f(y + R * 0.1)}Q${f(x)} ${f(y - R * 0.26)} ${f(x + R * 0.2)} ${f(y + R * 0.1)}`,
        c: eye,
        w: R * 0.12,
      });
    } else if (look === "asleep") {
      shapes.push({
        k: "stroke",
        d: `M${f(x - R * 0.2)} ${f(y - R * 0.02)}Q${f(x)} ${f(y + R * 0.22)} ${f(x + R * 0.2)} ${f(y - R * 0.02)}`,
        c: eye,
        w: R * 0.11,
      });
    } else if (look === "cross") {
      shapes.push({
        k: "stroke",
        d: `M${f(x - side * R * 0.2)} ${f(y - R * 0.16)}L${f(x + side * R * 0.16)} ${f(y)}L${f(x - side * R * 0.2)} ${f(y + R * 0.16)}`,
        c: eye,
        w: R * 0.11,
      });
    } else {
      const grow = look === "wide" ? 1.18 : 1;
      shapes.push({
        k: "ellipse",
        x: f(x),
        y: f(y),
        rx: f(R * 0.22 * grow),
        ry: f(R * 0.29 * grow),
        c: eye,
      });
      if (inverted) {
        shapes.push({
          k: "ellipse",
          x: f(x + dx * R * 0.05),
          y: f(y + dy * R * 0.06),
          rx: f(R * 0.12),
          ry: f(R * 0.17),
          c: inverted.pupil,
        });
      }
      shapes.push({
        k: "circle",
        x: f(x + R * 0.077 + ox * 0.2),
        y: f(y - R * 0.115 + oy * 0.2),
        r: f(R * (look === "wide" ? 0.1 : 0.082)),
        c: "glint",
      });
      if (look === "sleepy") {
        // A lid in the body's ink over the top half of the eye.
        shapes.push({
          k: "fill",
          d: `M${f(x - R * 0.3)} ${f(y - R * 0.36)}H${f(x + R * 0.3)}V${f(y - R * 0.02)}H${f(x - R * 0.3)}Z`,
          c: inverted ? "frizz" : "ink",
        });
      }
    }
  }
  return shapes;
}

/**
 * Returns what a special fuzzball wears behind its own fur, which says what
 * it does when it is set off.
 * @param {SpecialId} special
 * @returns {Shape[]}
 */
function aura(special) {
  if (special === "dasher-h" || special === "dasher-v") {
    // Fur combed out into streamers along the line it will dash down, and an
    // arrowhead past each end.
    const parts = [];
    for (const side of [-1, 1]) {
      const base = side === 1 ? 0 : Math.PI;
      for (const [spread, reach, half] of [
        [0, 1.9, 0.27],
        [0.5, 1.56, 0.2],
        [-0.5, 1.56, 0.2],
      ]) {
        const angle = base + spread;
        const [ax, ay] = polar(angle - half, R * 0.9);
        const [bx, by] = polar(angle + half, R * 0.9);
        const [tx, ty] = polar(angle, R * reach);
        parts.push(`M${f(ax)} ${f(ay)}L${f(tx)} ${f(ty)}L${f(bx)} ${f(by)}Z`);
      }
    }
    const d = parts.join("");
    /** @type {Shape[]} */
    const shapes = [
      { k: "fill", d, c: "aura" },
      { k: "stroke", d, c: "aura", w: R * 0.1 },
    ];
    return special === "dasher-v" ? shapes.map((s) => turned(s)) : shapes;
  }
  if (special === "puffer") {
    // A second coat, twice as deep, standing straight out all round.
    const parts = [];
    const n = 16;
    for (let i = 0; i < n; i++) {
      const angle = (i / n) * Math.PI * 2 + 0.2;
      parts.push(strand(angle, R * 0.8, R * (i % 2 === 0 ? 1.62 : 1.48), 0));
    }
    return [{ k: "stroke", d: parts.join(""), c: "aura", w: R * 0.36 }];
  }
  if (special === "wisp") {
    // A dandelion's parachute: a stem and a fan of fine hairs with a bead at
    // each tip.
    const top = -R * 1.02;
    const hub = -R * 1.5;
    const hairs = [];
    /** @type {Shape[]} */
    const beads = [];
    const n = 7;
    for (let i = 0; i < n; i++) {
      const angle = -Math.PI / 2 + (i - (n - 1) / 2) * 0.36;
      const [x, y] = polar(angle, R * 0.82);
      hairs.push(`M0 ${f(hub)}L${f(x)} ${f(hub + y)}`);
      beads.push({
        k: "circle",
        x: f(x),
        y: f(hub + y),
        r: f(R * 0.085),
        c: "aura",
      });
    }
    return [
      {
        k: "stroke",
        d: `M0 ${f(top + R * 0.2)}L0 ${f(hub)}`,
        c: "aura",
        w: R * 0.12,
      },
      { k: "stroke", d: hairs.join(""), c: "aura", w: R * 0.085 },
      ...beads,
    ];
  }
  throw new Error(`No aura for ${special}`);
}

/**
 * Returns a shape turned a quarter turn, for a dasher that runs up and down.
 * @param {Shape} shape
 * @returns {Shape}
 */
function turned(shape) {
  if (!shape.d) return shape;
  const d = shape.d.replace(
    /(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g,
    (_, x, y) => `${f(-Number(y))} ${f(Number(x))}`,
  );
  return { ...shape, d };
}

/**
 * Returns the sparks that stand about a frizzball, each a small zigzag.
 * @param {number} [count]
 * @param {number} [reach] Their distance from the center, in body radii.
 * @param {number} [turn] How far round the ring is turned, in radians.
 * @returns {Shape[]}
 */
function sparks(count = 4, reach = 1.78, turn = 0.5) {
  const parts = [];
  const s = R * 0.2;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + turn;
    // Each is a bolt that points away from the fuzzball, three strokes long.
    const points = [
      [-s * 1.1, -s * 0.5],
      [-s * 0.1, s * 0.45],
      [s * 0.1, -s * 0.45],
      [s * 1.1, s * 0.5],
    ].map(([along, across]) => {
      const [x, y] = polar(angle, R * reach + along);
      const [ox, oy] = polar(angle + Math.PI / 2, across);
      return `${f(x + ox)} ${f(y + oy)}`;
    });
    parts.push(`M${points.join("L")}`);
  }
  return [{ k: "stroke", d: parts.join(""), c: "spark", w: R * 0.13 }];
}

/**
 * Returns the frizzball: a fuzzball of no color with its fur on end and
 * static around it, the site's own look for a fuzzball fully charged.
 * @param {Palette} palette
 * @param {EyeLook} [look]
 * @param {number} [turn] How far round its sparks stand, which a view moves.
 * @returns {Shape[]}
 */
function frizzball(palette, look = "wide", turn = 0.62) {
  const n = 18;
  const strands = [];
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    strands.push(strand(angle, R * 0.78, R * (i % 2 === 0 ? 1.52 : 1.3), 0));
  }
  const inverted = palette.dark
    ? null
    : { white: "frizzEye", pupil: "frizzPupil" };
  return [
    ...sparks(4, 1.86, turn),
    { k: "stroke", d: strands.join(""), c: "frizz", w: R * 0.24 },
    ...body("frizz"),
    ...eyes(look, 0, 0, inverted),
  ];
}

/**
 * Returns the path of a rectangle with rounded corners.
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h
 * @param {number} r
 * @returns {string}
 */
function rrect(x, y, w, h, r) {
  return `M${f(x + r)} ${f(y)}H${f(x + w - r)}Q${f(x + w)} ${f(y)} ${f(x + w)} ${f(y + r)}V${f(y + h - r)}Q${f(x + w)} ${f(y + h)} ${f(x + w - r)} ${f(y + h)}H${f(x + r)}Q${f(x)} ${f(y + h)} ${f(x)} ${f(y + h - r)}V${f(y + r)}Q${f(x)} ${f(y)} ${f(x + r)} ${f(y)}Z`;
}

/**
 * Returns a square of the board, the well a fuzzball sits in, about its center.
 * @param {number} [dust] Layers of dust on it.
 * @returns {Shape[]}
 */
function square(dust = 0) {
  /** @type {Shape[]} */
  const shapes = [{ k: "fill", d: rrect(-47, -47, 94, 94, 17), c: "well" }];
  if (dust > 0) {
    // Dust is a paler square with a scuffed edge and specks, more of them when thick.
    shapes.push({
      k: "fill",
      d: rrect(-47, -47, 94, 94, 17),
      c: dust > 1 ? "dustDeep" : "dust",
    });
    const rand = rng(77 + dust);
    const count = dust > 1 ? 13 : 7;
    for (let i = 0; i < count; i++) {
      shapes.push({
        k: "circle",
        x: f((rand() - 0.5) * 74),
        y: f((rand() - 0.5) * 74),
        r: f(2.2 + rand() * (dust > 1 ? 3.2 : 2)),
        c: dust > 1 ? "dust" : "dustDeep",
      });
    }
  }
  return shapes;
}

/**
 * Returns the path of a pad: a rounded box whose sides bow out a little, as a
 * stuffed thing's do.
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h
 * @param {number} r
 * @param {number} [bow]
 * @returns {string}
 */
function pad(x, y, w, h, r, bow = 2) {
  const x1 = x + w;
  const y1 = y + h;
  const mx = x + w / 2;
  const my = y + h / 2;
  return (
    `M${f(x + r)} ${f(y)}Q${f(mx)} ${f(y - bow)} ${f(x1 - r)} ${f(y)}` +
    `Q${f(x1)} ${f(y)} ${f(x1)} ${f(y + r)}Q${f(x1 + bow)} ${f(my)} ${f(x1)} ${f(y1 - r)}` +
    `Q${f(x1)} ${f(y1)} ${f(x1 - r)} ${f(y1)}Q${f(mx)} ${f(y1 + bow)} ${f(x + r)} ${f(y1)}` +
    `Q${f(x)} ${f(y1)} ${f(x)} ${f(y1 - r)}Q${f(x - bow)} ${f(my)} ${f(x)} ${f(y + r)}` +
    `Q${f(x)} ${f(y)} ${f(x + r)} ${f(y)}Z`
  );
}

/** How many layers the thickest brick has. */
const BRICK_LAYERS = 4;

/**
 * A layer of a brick as it lies in its square: which layer it is, counted
 * from the bottom, where its middle is, and how wide and how tall it is.
 * @typedef {object} BrickLayer
 * @property {number} level 1 for the bottom layer, up to 4.
 * @property {number} x
 * @property {number} y
 * @property {number} w
 * @property {number} h
 */

/**
 * Returns where a brick's layers lie. They share the square between them, so
 * each is plumper the fewer are left.
 * @param {number} hits 1 to 4.
 * @returns {BrickLayer[]} From the bottom layer up.
 */
function brickLayers(hits) {
  const n = Math.max(1, Math.min(BRICK_LAYERS, Math.round(hits)));
  const gap = 1.6;
  const h = (88 - gap * (n - 1)) / n;
  /** @type {BrickLayer[]} */
  const layers = [];
  for (let level = 1; level <= n; level++) {
    layers.push({
      level,
      x: n === 1 ? 0 : [0, -1.2, 1.4, -1][level - 1],
      y: 44 - (level - 0.5) * h - (level - 1) * gap,
      w: 87 - (level - 1) * 2.6,
      h,
    });
  }
  return layers;
}

/**
 * Returns one layer of a brick about its own middle: a cushion of felt, plump,
 * shaded underneath and tufted with a button.
 * @param {number} level 1 for the bottom layer, up to 4.
 * @param {number} w
 * @param {number} h
 * @returns {Shape[]}
 */
function brickLayer(level, w, h) {
  const face = `felt${level}`;
  const side = `felt${level}Side`;
  const r = Math.min(h * 0.42, 15);
  const bow = Math.min(2.6, h / 10);
  const under = Math.max(3.5, Math.min(8, h * 0.18));
  const top = -h / 2;
  const mid = -under / 2;
  const button = Math.max(2.4, Math.min(5, h * 0.15));
  const reach = button + Math.max(4, Math.min(10, h * 0.26));
  const pinch = Math.max(1.6, Math.min(2.8, h * 0.1));
  const ear = Math.max(2.2, Math.min(4.4, h * 0.13));
  const shine = Math.max(1.6, Math.min(3, h * 0.1));
  return [
    // Its corners pinch out into little ears, as a cushion's do.
    {
      k: "circle",
      x: f(-w / 2 + 1.5),
      y: f(h / 2 - ear * 0.9),
      r: f(ear),
      c: side,
    },
    {
      k: "circle",
      x: f(w / 2 - 1.5),
      y: f(h / 2 - ear * 0.9),
      r: f(ear),
      c: side,
    },
    {
      k: "circle",
      x: f(-w / 2 + 1.5),
      y: f(top + ear * 0.9),
      r: f(ear),
      c: face,
    },
    {
      k: "circle",
      x: f(w / 2 - 1.5),
      y: f(top + ear * 0.9),
      r: f(ear),
      c: face,
    },
    { k: "fill", d: pad(-w / 2, top, w, h, r, bow), c: side },
    { k: "fill", d: pad(-w / 2, top, w, h - under, r, bow), c: face },
    {
      k: "stroke",
      d: `M${f(-w / 2 + r + 1)} ${f(top + shine * 1.5)}Q0 ${f(top + shine * 1.5 - bow)} ${f(w / 2 - r - 1)} ${f(top + shine * 1.5)}`,
      c: "#ffffff",
      w: f(shine),
      o: 0.2,
    },
    {
      k: "stroke",
      d: `M${f(-reach)} ${f(mid)}L${f(reach)} ${f(mid)}`,
      c: side,
      w: f(pinch),
    },
    { k: "circle", x: 0, y: f(mid), r: f(button), c: side },
  ];
}

/**
 * Returns a brick: a pile of felt cushions, one for each hit it has left, each
 * a shade of a color no fuzzball wears, darkest on top.
 * @param {number} hits 1 to 4.
 * @returns {Shape[]}
 */
function brick(hits) {
  return brickLayers(hits).flatMap((layer) =>
    brickLayer(layer.level, layer.w, layer.h).map((s) =>
      moved(s, layer.x, layer.y),
    ),
  );
}

/**
 * Returns a cage, drawn over the friend it holds.
 * @returns {Shape[]}
 */
function cage() {
  const bars = [-24, -8, 8, 24].map((x) => `M${x} -40V40`).join("");
  return [
    { k: "stroke", d: rrect(-41, -41, 82, 82, 13), c: "steelDark", w: 9 },
    { k: "stroke", d: bars, c: "steel", w: 6.5 },
    { k: "stroke", d: rrect(-41, -41, 82, 82, 13), c: "steelLight", w: 3.4 },
  ];
}

/**
 * Returns a burr's hold on a fuzzball: a ring of thorns round it.
 * @returns {Shape[]}
 */
function burr() {
  const n = 22;
  const points = [];
  for (let i = 0; i < n; i++) {
    const [x, y] = polar(
      (i / n) * Math.PI * 2,
      R * (i % 2 === 0 ? 1.74 : 1.42),
    );
    points.push(`${f(x)} ${f(y)}`);
  }
  const d = `M${points.join("L")}Z`;
  return [
    { k: "stroke", d, c: "burrDark", w: R * 0.27 },
    { k: "stroke", d, c: "burr", w: R * 0.13 },
  ];
}

/**
 * Returns a sleepyhead: a pale fuzzball in a nightcap with its eyes shut.
 * @param {EyeLook} [look]
 * @returns {Shape[]}
 */
function sleepy(look = "asleep") {
  const coat = coat2();
  const cap = `M${f(-R * 0.86)} ${f(-R * 0.5)}Q${f(-R * 0.1)} ${f(-R * 1.9)} ${f(R * 1.16)} ${f(-R * 1.36)}Q${f(R * 0.6)} ${f(-R * 0.9)} ${f(R * 0.86)} ${f(-R * 0.5)}Z`;
  /** @type {Shape[]} */
  const shapes = [
    coat,
    { k: "circle", x: 0, y: 0, r: R, c: "sleepy" },
    { k: "fill", d: cap, c: "sleepyDark" },
    {
      k: "stroke",
      d: `M${f(-R * 0.9)} ${f(-R * 0.48)}Q0 ${f(-R * 0.86)} ${f(R * 0.9)} ${f(-R * 0.48)}`,
      c: "frizz",
      w: R * 0.24,
    },
    { k: "circle", x: f(R * 1.2), y: f(-R * 1.34), r: f(R * 0.22), c: "frizz" },
  ];
  return [
    ...shapes,
    ...eyes(look, 0, 0.9).map((s) => moved(s, 0, R * 0.12)),
  ].map((s) => moved(s, 0, R * 0.2));
}

/**
 * Returns a sleepyhead's coat, short and drooping.
 * @returns {Shape}
 */
function coat2() {
  const rand = rng(91);
  const parts = [];
  const n = 22;
  for (let i = 0; i < n; i++) {
    const angle = (i / n) * Math.PI * 2 + (rand() - 0.5) * 0.1;
    const droop = Math.sin(angle) > 0 ? 0.08 : -0.02;
    parts.push(
      strand(
        angle,
        R * 0.78,
        R * (1.14 + droop + rand() * 0.06),
        Math.cos(angle) > 0 ? 0.22 : -0.22,
      ),
    );
  }
  return { k: "stroke", d: parts.join(""), c: "sleepy", w: R * 0.27 };
}

/**
 * Returns a whole fuzzball of one kind, seated in its cell.
 * @param {KindId} kind
 * @param {object} [o]
 * @param {EyeLook} [o.look]
 * @param {number} [o.dx]
 * @param {number} [o.dy]

      [thump, 0, 0.7],
      [cloth, 0.008, 0.42],
      [spring, 0.05, 0.6],
      [over, 0.05, 0.34],
    ]),
    -14,
  );
}

/**
 * Returns a few bright specks scattered over a moment, each on the scale.
 * @param {number} seconds
 * @param {number} count
 * @param {number} seed
 * @returns {Float32Array}
 */
function sparkle(seconds, count, seed) {
  const out = silence(seconds + 0.2);
  let a = seed * 7919;
  for (let n = 0; n < count; n++) {
    a = (Math.imul(a, 1103515245) + 12345) >>> 0;
    const at = ((a >>> 8) % 1000) / 1000;
    a = (Math.imul(a, 1103515245) + 12345) >>> 0;
    const step = 5 + ((a >>> 8) % 5);
    const speck = shape(tone("sine", rung(step) * 2, 0.09), {
      attack: 0.004,
      decay: 0.022,
    });
    add(out, speck, at * seconds, 0.35 + 0.3 * (1 - at));
  }
  return filter(out, "low", 5600);
}

/**
 * The note a bunch plays: one step of the ladder for each wave of a move, and
 * a fuller chord the bigger the bunch.
 * @param {number} step The wave, from 0.
 * @param {number} [size] How many fuzzballs the bunch gathered.
 * @param {number} [variant] 0, 1 or 2: three takes on the puff of air, so a note heard often does not tire.
 * @returns {Float32Array}
 */
function note(step, size = 3, variant = 0) {
  /** @type {[Float32Array, number, number][]} */
  const parts = [
    [
      mallet(rung(step), {
        seed: 3 + variant * 11,
        air: 0.32 + variant * 0.04,
      }),
      0,
      1,
    ],
  ];
  if (size >= 4)
    parts.push([mallet(rung(step + 2), { air: 0.1, seed: 9 }), 0.022, 0.6]);
  if (size >= 5)
    parts.push([mallet(rung(step + 4), { air: 0.1, seed: 13 }), 0.044, 0.5]);
  return finish(layer(parts), -10 - Math.min(step, 9) * 0.4);
}

/**
 * The pop of one fuzzball hopping off: a bubble's blip, an octave pair that
 * rises an octave in 70 ms.
 * @param {number} step
 * @returns {Float32Array}
 */
function pop(step) {
  const base = rung(step);
  const pitch = (/** @type {number} */ t) => base * 2 ** Math.min(1, t / 0.07);
  const low = shape(tone("sine", pitch, 0.16), {
    attack: 0.004,
    hold: 0.03,
    decay: 0.022,
  });
  const high = shape(
    tone("sine", (t) => pitch(t) * 2, 0.16),
    { attack: 0.004, hold: 0.02, decay: 0.018 },
  );
  return finish(
    layer([
      [low, 0, 0.8],
      [high, 0, 0.3],
    ]),
    -16,
  );
}

/**
 * The tick of static landing on one fuzzball, which climbs as a frizzball
 * takes them in turn.
 * @param {number} step
 * @returns {Float32Array}
 */
function zap(step) {
  const blip = shape(tone("triangle", rung(step) * 2, 0.07), {
    attack: 0.002,
    decay: 0.012,
  });
  const tick = shape(filter(noise(0.02, 21 + step), "band", 3600, 1.2), {
    attack: 0.001,
    decay: 0.004,
  });
  return finish(
    filter(
      layer([
        [blip, 0, 0.7],
        [tick, 0, 0.5],
      ]),
      "low",
      5600,
    ),
    -16,
  );
}

/**
 * A fuzzball's cheer as a move's waves pile up, louder and fuller by the tier.
 * @param {number} tier 1 to 4, at the 3rd, 5th, 7th and 9th wave.
 * @returns {Float32Array}
 */
function chirp(tier) {
  const from = [0, 500, 560, 620, 700][tier];
  const rise = 3 + tier;
  const seconds = 0.15 + tier * 0.04;
  /** @type {[Float32Array, number, number][]} */
  const parts = [[voice({ from, rise, seconds }), 0, 1]];
  if (tier >= 3)
    parts.push([voice({ from: from * 1.26, rise, seconds }), 0.02, 0.6]);
  if (tier >= 4)
    parts.push([voice({ from: from * 1.5, rise, seconds }), 0.04, 0.5]);
  return finish(warm(layer(parts), 1.2), -14 + tier * 0.8);
}

/**
 * Returns the sound of a special fuzzball being made: a rising fifth, and
 * something of what it will do.
 * @param {'dasher' | 'puffer' | 'wisp' | 'frizz'} what
 * @returns {Float32Array}
 */
function born(what) {
  if (what === "frizz") {
    /** @type {[Float32Array, number, number][]} */
    const parts = [5, 7, 8, 10].map((step, n) => [
      bell(rung(step), 0.13),
      n * 0.05,
      0.7,
    ]);
    const crackle = silence(0.5);
    for (let n = 0; n < 14; n++) {
      const tick = shape(
        filter(noise(0.012, 40 + n), "band", 3000 + (n % 4) * 500, 2),
        {
          attack: 0.001,
          decay: 0.003,
        },
      );
      add(crackle, tick, 0.02 + ((n * 37) % 100) / 240, 0.5);
    }
    parts.push([crackle, 0, 0.45], [sparkle(0.35, 6, 3), 0.15, 0.5]);
    return finish(room(layer(parts), { seconds: 0.4, wet: 0.18 }), -6, 0.05);
  }
  const root =
    what === "wisp" ? rung(5) : what === "puffer" ? rung(0) : rung(2);
  /** @type {[Float32Array, number, number][]} */
  const parts = [
    [bell(root, 0.1), 0, 0.8],
    [bell(root * 1.5, 0.14), 0.1, 0.9],
  ];
  if (what === "dasher") {
    parts.push([
      whoosh({
        seconds: 0.16,
        from: 700,
        peak: 3200,
        to: 2400,
        q: 2,
        lean: 0.8,
      }),
      0.02,
      0.5,
    ]);
  } else if (what === "puffer") {
    const swell = shape(tone("sine", ramp(200, 330, 0.16), 0.24), {
      attack: 0.09,
      decay: 0.05,
      curve: 2,
    });
    parts.push(
      [swell, 0, 0.6],
      [
        shape(tone("sine", ramp(400, 660, 0.16), 0.24), {
          attack: 0.09,
          decay: 0.05,
          curve: 2,
        }),
        0,
        0.3,
      ],
    );
  } else {
    const flutter = gain(
      whoosh({
        seconds: 0.26,
        from: 1400,
        peak: 2600,
        to: 2000,
        q: 2.5,
        seed: 8,
      }),
      (t) => 0.6 + 0.4 * Math.sin(2 * Math.PI * 22 * t),
    );
    parts.push([flutter, 0.02, 0.4]);
  }
  parts.push([sparkle(0.2, 3, what.length), 0.12, 0.35]);
  return finish(room(layer(parts), { seconds: 0.3, wet: 0.14 }), -7, 0.04);
}

/**
 * Returns the sound of a blast: the air let go when a puffer goes off, bigger
 * for two set off together.
 * @param {boolean} [big]
 * @returns {Float32Array}
 */
function puff(big = false) {
  const low = big ? 165 : 220;
  const long = big ? 1.5 : 1;
  const breath = gain(
    filter(noise(0.14, 31), "band", ramp(400, 1900, 0.14), 1.4),
    (t) => (t / 0.14) ** 2.2,
  );
  /** @type {[Float32Array, number, number][]} */
  const body = [1, 2, 3, 4].map((n) => [
    shape(
      tone("sine", glide(low * n * 1.25, low * n * 0.6, 0.07), 0.5 * long),
      {
        attack: 0.005,
        decay: (0.11 * long) / n ** 0.4,
      },
    ),
    0.14,
    [0, 0.55, 0.7, 0.5, 0.25][n],
  ]);
  const burst = shape(
    filter(noise(0.6 * long, 33), "low", glide(4200, 800, 0.1 * long)),
    {
      attack: 0.004,
      decay: 0.11 * long,
    },
  );
  const air = shape(filter(noise(0.7 * long, 35), "band", 950, 0.7), {
    attack: 0.02,
    decay: 0.2 * long,
  });
  /** @type {[Float32Array, number, number][]} */
  const parts = [
    [breath, 0, 0.5],
    ...body,
    [burst, 0.14, 1.1],
    [air, 0.14, 0.4],
  ];
  if (big) parts.push([sparkle(0.5, 8, 4), 0.2, 0.3]);
  return finish(
    room(warm(layer(parts), 1.3), { seconds: 0.4 * long, wet: 0.16 }),
    big ? -4 : -5,
    0.06,
  );
}

 * @param {number} from
 * @param {Set<number>} taken
 * @param {Uint8Array} gone Squares already gathered this step.
 * @returns {number} The square, or -1 where nothing is left to strike.
 */
function wispTarget(s, from, taken, gone) {
  const { w } = s;
  const needs = new Set();
  const wanted = new Set();
  s.goals.forEach((g, gi) => {
    if (s.left[gi] <= 0) return;
    if (g.type === "gather") wanted.add(g.kind);
    else needs.add(g.type);
  });
  // Under a sleepyhead, whatever holds it up is worth striking.
  const under = new Set();
  if (needs.has("sleepy")) {
    for (let i = 0; i < s.piece.length; i++) {
      if (s.piece[i]?.t !== "sleepy") continue;
      for (let j = i + w; j < s.piece.length; j += w) {
        if (s.open[j] && s.piece[j]) {
          under.add(j);
          break;
        }
      }
    }
  }
  let best = -1;
  let bestScore = -1;
  const fx = from % w;
  const fy = (from - fx) / w;
  for (let i = 0; i < s.piece.length; i++) {
    if (!s.open[i] || taken.has(i) || gone[i] || i === from) continue;
    const p = s.piece[i];
    let worth = 0;
    if (p?.cage) worth = needs.has("cage") ? 90 : 30;
    else if (p?.t === "brick") worth = needs.has("brick") ? 80 - p.hp : 24;
    else if (under.has(i)) worth = 70;
    else if (p?.burr) worth = 60;
    else if (s.dust[i] > 0 && needs.has("dust") && p && p.t !== "sleepy")
      worth = 50 + s.dust[i];
    else if (p?.t === "fuzz" && wanted.has(p.k)) worth = 40;
    else if (p?.t === "fuzz") worth = 10;
    if (worth === 0) continue;
    const x = i % w;
    const y = (i - x) / w;
    const far = Math.abs(x - fx) + Math.abs(y - fy);
    const score = worth * 1000 + far * 10 + (hash(s.seed, s.turn, i, 7) % 10);
    if (score > bestScore) {
      bestScore = score;
      best = i;
    }
  }
  return best;
}

/**
 * Returns the kind a frizzball takes when nothing chose one for it: the kind
 * with the most fuzzballs on the board.
 * @param {State} s
 * @returns {number}
 */
function commonKind(s) {
  const counts = new Array(s.kinds).fill(0);
  for (const p of s.piece) if (p && p.t === "fuzz") counts[p.k]++;
  let best = 0;
  for (let k = 1; k < counts.length; k++)
    if (counts[k] > counts[best]) best = k;
  return best;
}

/**
 * Plays one wave: gathers the bunches, sets off what they and the move set
 * off, and lets the board fall.
 * @param {State} s
 * @param {number} n The wave's number in its move.
 * @param {Bunch[]} bunches
 * @param {{ what: string, i: number, id: number, kind: number }[]} first Blasts the move itself sets off.
 * @param {{ burrGone: boolean }} flags
 * @param {boolean} keep Whether to write the step down.
 * @returns {Step | null}
 */
function wave(s, n, bunches, first, flags, keep) {
  const { w, h } = s;
  const size = w * h;
  const gone = new Uint8Array(size);
  const safe = new Uint8Array(size);
  /** @type {Hit[]} */
  const hits = [];
  /** @type {Blast[]} */
  const blasts = [];
  /** @type {{ what: string, i: number, id: number, kind: number, after: number, wait: number }[]} */
  const queue = [];
  const taken = new Set();
  const times = Math.min(n, 5);

  /** @param {string} type @param {number} [kind] */
  const count = (type, kind) => {
    s.goals.forEach((g, gi) => {
      if (g.type !== type) return;
      if (g.type === "gather" && g.kind !== kind) return;
      s.left[gi]--;
    });
  };
  /** @param {number} i @param {number} src @param {number} rank */
  const sweep = (i, src, rank) => {
    if (s.dust[i] > 0) {
      s.dust[i]--;
      count("dust");
      s.score += 20 * times;
      if (keep)
        hits.push({ i, id: -1, what: "dust", rank, src, dustLeft: s.dust[i] });
    }
  };
  /**
   * Takes a fuzzball off the board, and sets it off if it is a special one.
   * @param {number} i @param {number} src @param {number} rank
   */
  const gather = (i, src, rank) => {
    const p = /** @type {Piece} */ (s.piece[i]);
    if (p.cage) {
      p.cage = false;
      count("cage");
    }
    if (p.burr) {
      p.burr = false;
      flags.burrGone = true;
    }
    s.piece[i] = null;
    gone[i] = 1;
    if (p.t === "fuzz") count("gather", p.k);
    s.score += 10 * times;
    if (keep) hits.push({ i, id: p.id, what: "gather", rank, src, kind: p.k });
    sweep(i, src, rank);
    if (p.sp)
      queue.push({
        what: p.sp,
        i,
        id: p.id,
        kind: p.k,
        after: src,
        wait: rank,
      });
    else if (p.t === "frizz") {
      queue.push({
        what: "frizz",
        i,
        id: p.id,
        kind: commonKind(s),
        after: src,
        wait: rank,
      });
    }
  };
  /**
   * Strikes a square once, taking the outermost thing there.
   * @param {number} i @param {number} src @param {number} rank
   */
  const strike = (i, src, rank) => {
    if (safe[i]) return;
    const p = s.piece[i];
    if (!p) {
      sweep(i, src, rank);
      return;
    }
    if (p.t === "brick") {
      p.hp--;
      s.score += 20 * times;
      if (p.hp <= 0) {
        s.piece[i] = null;
        count("brick");
        if (keep) hits.push({ i, id: p.id, what: "break", rank, src });
      } else if (keep) hits.push({ i, id: p.id, what: "knock", rank, src });
      return;
    }
    if (p.t === "sleepy") {
      if (keep) hits.push({ i, id: p.id, what: "ruffle", rank, src });
      return;
    }
    if (p.cage) {
      p.cage = false;
      count("cage");
      s.score += 30 * times;
      if (keep) hits.push({ i, id: p.id, what: "uncage", rank, src });
      return;
    }
    if (p.burr) {
      p.burr = false;
      flags.burrGone = true;
      if (keep) hits.push({ i, id: p.id, what: "unburr", rank, src });
      return;
    }
    gather(i, src, rank);
  };

  // The bunches: every fuzzball in one is gathered, but for the one that
  // becomes a special, and a bunch knocks the bricks and burrs beside it.
  /** @type {{ i: number, born: NonNullable<Bunch['born']>, kind: number, bunch: Bunch }[]} */
  const later = [];
  for (const bunch of bunches) {
    for (const i of bunch.cells) {
      const p = /** @type {Piece} */ (s.piece[i]);
      if (bunch.born && i === bunch.keeper && !p.sp) {
        if (p.cage) {
          p.cage = false;
          count("cage");
        }
        if (p.burr) {
          p.burr = false;
          flags.burrGone = true;
        }
        if (bunch.born === "frizz") {
          p.t = "frizz";
          p.k = -1;
        } else p.sp = bunch.born;
        bunch.bornId = p.id;
        safe[i] = 1;
        s.score += 60 * times;
        sweep(i, -1, 0);
        if (keep)
          hits.push({
            i,
            id: p.id,
            what: "born",
            rank: 0,
            src: -1,
            kind: bunch.kind,
          });
      } else {
        if (bunch.born && i === bunch.keeper) {
          later.push({ i, born: bunch.born, kind: bunch.kind, bunch });
          safe[i] = 1;
        }
        gather(i, -1, 0);
      }
    }
    const beside = new Set();
    for (const i of bunch.cells) {
      const x = i % w;
      const y = (i - x) / w;
      for (const [dx, dy] of DIRS) {
        const xx = x + dx;
        const yy = y + dy;
        if (xx < 0 || xx >= w || yy < 0 || yy >= h) continue;
        beside.add(yy * w + xx);
      }
    }
    for (const j of beside) {
      const p = s.piece[j];
      if (!p || gone[j] || safe[j]) continue;
      if (p.t === "brick") strike(j, -1, 1);
      else if (p.burr && !bunch.cells.includes(j)) strike(j, -1, 1);
    }
  }

  for (const f of first) queue.push({ ...f, after: -1, wait: 0 });

  // What went off, in the order it was set off.
  while (queue.length > 0) {
    const q = /** @type {(typeof queue)[number]} */ (queue.shift());
    const src = blasts.length;
    /** @type {Blast} */
    const blast = {
      what: q.what,
      i: q.i,
      id: q.id,
      kind: q.kind,
      after: q.after,
      wait: q.wait,
      cells: [],
    };
    blasts.push(blast);
    if (q.what === "wisp" || q.what === "wisp3" || q.what.startsWith("wisp-")) {
      const flights = q.what === "wisp3" ? 3 : 1;
      blast.from = q.i;
      blast.targets = [];
      for (let t = 0; t < flights; t++) {
        const target = wispTarget(s, q.i, taken, gone);
        if (target < 0) break;
        taken.add(target);
        blast.targets.push(target);
        blast.cells.push(target);
        if (q.what === "wisp" || q.what === "wisp3") strike(target, src, 1 + t);
        else {
          // It carries what it was swapped with, which goes off where it lands.
          const carried = q.what.slice(5);
          queue.push({
            what: carried,
            i: target,
            id: -1,
            kind: q.kind,
            after: src,
            wait: 1,
          });
        }
      }
    } else if (q.what === "frizz") {
      const cells = reach(s, "all", q.i).filter(({ i }) => {
        const p = s.piece[i];
        return p && p.t === "fuzz" && p.k === q.kind && !gone[i];
      });
      cells.forEach(({ i }, order) => {
        blast.cells.push(i);
        strike(i, src, order + 1);
      });
    } else if (q.what.startsWith("frizz-") && q.what !== "frizz-frizz") {
      const gives = q.what.slice(6);
      const cells = reach(s, "all", q.i).filter(({ i }) => {
        const p = s.piece[i];
        return (
          p &&
          p.t === "fuzz" &&
          p.k === q.kind &&
          !p.cage &&
          !gone[i] &&
          !safe[i]
        );
      });
      cells.forEach(({ i }, order) => {
        const p = /** @type {Piece} */ (s.piece[i]);
        blast.cells.push(i);
        p.sp = /** @type {Special} */ (
          gives === "dash" ? (order % 2 ? "dash-v" : "dash-h") : gives
        );
        p.burr = false;
      });
      cells.forEach(({ i }, order) => {
        if (!gone[i] && s.piece[i]) gather(i, src, order + 1);
      });
    } else {
      const what = q.what === "frizz-frizz" ? "all" : q.what;
      for (const { i, rank } of reach(s, what, q.i)) {
        blast.cells.push(i);
        strike(i, src, rank);
      }
    }
  }

  // A special made from a fuzzball that was already one stands where it stood.
  for (const { i, born, kind, bunch } of later) {
    const id = s.nextId++;
    s.piece[i] =
      born === "frizz"
        ? { id, t: "frizz", k: -1, sp: null, cage: false, burr: false, hp: 0 }
        : { id, t: "fuzz", k: kind, sp: born, cage: false, burr: false, hp: 0 };
    bunch.bornId = id;
    if (keep) hits.push({ i, id, what: "born", rank: 0, src: -1, kind });
  }

  const fallsDown = settle(s, keep, hits);
  if (!keep) return null;
  return {
    n,
    bunches,
    blasts,
    hits,
    falls: fallsDown,
    left: s.left.slice(),
    score: s.score,
  };
}

/**
 * Lets everything that can fall do so, rolls fuzzballs in under what holds
 * still, lets new ones in at the top, and puts sleepyheads to bed.
 * @param {State} s
 * @param {boolean} keep
 * @param {Hit[]} hits
 * @returns {Fall[]}
 */
function settle(s, keep, hits) {
  const { w, h } = s;
  /** @type {Map<number, Fall>} */
  const moved = new Map();
  const lanes = s.spawned[s.rot];
  /** @param {Piece} p @param {number} from @param {number} to @param {boolean} spawn @param {number} lane */
  const note = (p, from, to, spawn, lane) => {
    if (!keep) return;
    let fall = moved.get(p.id);
    if (!fall)
      moved.set(
        p.id,
        (fall = { id: p.id, path: [from], spawn, kind: p.k, lane }),
      );
    fall.path.push(to);
  };
  let again = true;
  while (again) {
    again = false;
    // Straight down, a column at a time, from the bottom.
    for (let x = 0; x < w; x++) {
      for (let y = h - 1; y >= 0; y--) {
        const i = y * w + x;
        if (!s.open[i] || s.piece[i]) continue;
        let from = -2;
        for (let yy = y - 1; yy >= 0; yy--) {
          const j = yy * w + x;
          if (!s.open[j]) continue;
          const p = s.piece[j];
          if (!p) continue;
          from = falls(p) ? j : -3;
          break;
        }
        if (from === -3) continue;
        if (from >= 0) {
          const p = /** @type {Piece} */ (s.piece[from]);
          s.piece[i] = p;
          s.piece[from] = null;
          note(p, from, i, false, x);
          again = true;
        } else {
          const k = hash(s.seed, s.rot * 64 + x, lanes[x]++, 3) % s.kinds;
          const p = {
            id: s.nextId++,
            t: /** @type {PieceType} */ ("fuzz"),
            k,
            sp: null,
            cage: false,
            burr: false,
            hp: 0,
          };
          s.piece[i] = p;
          note(p, -1, i, true, x);
          again = true;
        }
      }
    }
    if (again) continue;
    // Then a roll: an empty square with something fixed over it takes the
    // fuzzball diagonally above, if that one has come to rest.
    roll: for (let y = h - 1; y >= 1; y--) {
      for (let x = 0; x < w; x++) {
        const i = y * w + x;
        if (!s.open[i] || s.piece[i]) continue;
        const sides = (x + y + s.turn) % 2 === 0 ? [-1, 1] : [1, -1];
        for (const dx of sides) {
          const xx = x + dx;
          if (xx < 0 || xx >= w) continue;
          const j = (y - 1) * w + xx;
          const p = s.piece[j];
          if (!s.open[j] || !p || !falls(p)) continue;
          s.piece[i] = p;
          s.piece[j] = null;
          note(p, j, i, false, x);
          again = true;
          break roll;
        }
      }
    }
    if (again) continue;
    // A sleepyhead that has reached a bed leaves the board.
    for (let i = 0; i < s.piece.length; i++) {
      const p = s.piece[i];
      if (p && p.t === "sleepy" && s.bed[i]) {
        s.piece[i] = null;
        s.goals.forEach((g, gi) => {
          if (g.type === "sleepy") s.left[gi]--;
        });
        s.score += 200;
        if (keep) hits.push({ i, id: p.id, what: "bed", rank: 0, src: -2 });
        again = true;
      }
    }
  }
  return [...moved.values()];
}

/**
 * Plays waves until the board is still.
 * @param {State} s
 * @param {Bunch[]} bunches The first wave's bunches.
 * @param {{ what: string, i: number, id: number, kind: number }[]} first
 * @param {{ burrGone: boolean }} flags
 * @param {boolean} keep
 * @param {number} [from] The first wave's number.
 * @returns {Step[]}
 */
function cascade(s, bunches, first, flags, keep, from = 1) {
  /** @type {Step[]} */
  const steps = [];
  let n = from;
  let found = bunches;
  let start = first;
  while (found.length > 0 || start.length > 0) {
    const step = wave(s, n, found, start, flags, keep);
    if (step) steps.push(step);
    n++;
    found = findBunches(s);
    start = [];
    if (n > 60) break;
  }
  return steps;
}

/**
 * Returns whether every goal is met.
 * @param {State} s
 * @returns {boolean}
 */
function goalsMet(s) {
  return s.left.every((n) => n <= 0);
}

/**
 * Plays a move on a game, changing it, and returns what happened.
 * @param {State} s
 * @param {number} a The square picked up.
 * @param {number} b The neighbor it is swapped with.
 * @param {boolean} [keep] Whether to write the move down for a view.
 * @returns {Record | null} Null where nothing was kept; the game is changed either way.
 */
function play(s, a, b, keep = false) {
  /** @type {Record} */
  const record = {
    swap: { a, b, ok: false },
    steps: [],
    burr: null,
    gust: null,
    shuffle: null,
    won: false,
    lost: false,
  };
  const alone = a === b;
  const apart =
    Math.abs((a % s.w) - (b % s.w)) +
    Math.abs(Math.floor(a / s.w) - Math.floor(b / s.w));
  if (
    s.won ||
    s.lost ||
    apart > 1 ||
    !canSwap(s, a) ||
    !canSwap(s, b) ||
    (!alone && !swapWorks(s, a, b))
  ) {
    return keep ? record : null;
  }
  const pa = /** @type {Piece} */ (s.piece[a]);
  const pb = /** @type {Piece} */ (s.piece[b]);
  const flags = { burrGone: false };
  /** @type {{ what: string, i: number, id: number, kind: number }[]} */
  const first = [];
  /** @type {Bunch[]} */
  let bunches = [];
  const specialA = pa.sp || (pa.t === "frizz" ? "frizz" : null);
  const specialB = pb.sp || (pb.t === "frizz" ? "frizz" : null);
  if (alone && !specialA) return keep ? record : null;
  record.swap.ok = true;

  if (alone) {
    // A special picked up and put down again goes off where it stands.
    s.piece[a] = null;
    if (pa.t === "fuzz") {
      s.goals.forEach((g, gi) => {
        if (g.type === "gather" && g.kind === pa.k) s.left[gi]--;
      });
    }
    first.push({
      what: /** @type {string} */ (specialA),
      i: a,
      id: pa.id,
      kind: pa.t === "frizz" ? commonKind(s) : pa.k,
    });
  } else if (specialA && specialB) {
    // Two specials swapped go off together, where the first was carried to.
    s.piece[a] = null;
    s.piece[b] = null;
    for (const p of [pa, pb]) {
      if (p.t === "fuzz") {
        s.goals.forEach((g, gi) => {
          if (g.type === "gather" && g.kind === p.k) s.left[gi]--;
        });
      }
    }
    const kinds = [specialA, specialB].map((sp) =>
      sp.startsWith("dash") ? "dash" : sp,
    );
    const has = (/** @type {string} */ k) => kinds.includes(k);
    const kind = pa.t === "fuzz" ? pa.k : pb.k;
    let what = "cross";
    if (has("frizz")) {
      const other = kinds[0] === "frizz" ? kinds[1] : kinds[0];
      what = `frizz-${other}`;
    } else if (has("wisp")) {
      const other = kinds[0] === "wisp" ? kinds[1] : kinds[0];
      const carried =
        other === "dash"
          ? specialA.startsWith("dash")
            ? specialA
            : specialB
          : other;
      what = other === "wisp" ? "wisp3" : `wisp-${carried}`;
    } else if (has("puff") && has("dash")) what = "bigcross";
    else if (has("puff")) what = "bigpuff";
    const frizzKind = pa.t === "frizz" ? pb.k : pa.k;
    first.push({
      what,
      i: b,
      id: pa.id,
      kind: has("frizz") ? frizzKind : kind,
    });
    if (keep) record.swap = { a, b, ok: true };
  } else if (specialA === "frizz" || specialB === "frizz") {
    // A frizzball takes the kind of the fuzzball it is swapped with.
    const frizzAt = specialA === "frizz" ? b : a;
    const frizz = specialA === "frizz" ? pa : pb;
    const other = specialA === "frizz" ? pb : pa;
    s.piece[a] = pb;
    s.piece[b] = pa;
    s.piece[frizzAt] = null;
    first.push({ what: "frizz", i: frizzAt, id: frizz.id, kind: other.k });
  } else {
    s.piece[a] = pb;
    s.piece[b] = pa;
    bunches = findBunches(s, a, b);
    // A special swapped goes off where it lands, bunch or no bunch.
    for (const [p, at] of /** @type {[Piece, number][]} */ ([
      [pa, b],
      [pb, a],
    ])) {
      if (!p.sp) continue;
      if (bunches.some((bunch) => bunch.cells.includes(at))) continue;
      s.piece[at] = null;
      s.goals.forEach((g, gi) => {
        if (g.type === "gather" && g.kind === p.k) s.left[gi]--;
      });
      first.push({ what: p.sp, i: at, id: p.id, kind: p.k });
    }
  }

  record.steps = cascade(s, bunches, first, flags, keep);
  s.moves--;
  s.turn++;

  if (goalsMet(s)) {
    s.won = true;
    record.won = true;
    return keep ? record : null;
  }

  // Burrs spread after a move that brushed none off.
  if (!flags.burrGone) {
    const spread = spreadBurr(s);
    if (spread) record.burr = spread;
  }

  // The wind turns, and everything falls the new way.
  if (s.gust) {
    s.gust.wait--;
    if (s.gust.wait <= 0) {
      s.gust.wait = s.gust.every;
      turnBoard(s, s.gust.turn);
      /** @type {Hit[]} */
      const hits = [];
      const fallsDown = settle(s, keep, hits);
      /** @type {Step} */
      const fall = {
        n: 0,
        bunches: [],
        blasts: [],
        hits,
        falls: fallsDown,
        left: s.left.slice(),
        score: s.score,
      };
      const steps = cascade(s, findBunches(s), [], flags, keep, 1);
      record.gust = { rot: s.rot, steps: [fall, ...steps] };
      if (goalsMet(s)) {
        s.won = true;
        record.won = true;
        return keep ? record : null;
      }
    }
  }

  if (s.moves <= 0) {
    s.lost = true;
    record.lost = true;
    return keep ? record : null;
  }
  if (legalMoves(s).length === 0) record.shuffle = shuffle(s);
  return keep ? record : null;
}

/**
 * Spreads one burr to a fuzzball beside a burred one, where any can spread.
 * @param {State} s
